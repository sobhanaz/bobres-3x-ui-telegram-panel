name: Release

# Triggered by pushing a tag like v0.1.0. Publishes signed multi-arch images to ghcr.io
# and attaches CLI binaries + checksums to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign signing

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BOBRES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      BOBRES_TEST_REDIS_ADDR: localhost:6379
      BOBRES_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x" # latest patch, see ci.yml
          check-latest: true
          cache: true
      - run: go test -race -count=1 ./...
      - run: GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: |
          "$(go env GOPATH)/bin/govulncheck" -format json ./... > govulncheck.json
          tools/ci/vulncheck-gate.sh govulncheck.json .govulncheck-allow

  images:
    name: Image ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [core, bot, payments, provisioner]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bobres-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/bobres-${{ matrix.service }}@${{ steps.build.outputs.digest }}

  cli:
    name: CLI binaries + release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x" # latest patch, see ci.yml
          check-latest: true
          cache: true
      - name: Build bobres for all platforms
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/sobhanaz/bobres-3x-ui-telegram-panel/internal/version.Version=${GITHUB_REF_NAME}" \
              -o "dist/bobres_${os}_${arch}" ./cmd/bobres
          done
      - name: Sign checksums (Ed25519)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_KEY_ID: ${{ vars.RELEASE_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          test -n "$RELEASE_KEY_ID" || { echo "RELEASE_KEY_ID repo variable is not set"; exit 1; }
          tools/sign/sign.sh --version "$GITHUB_REF_NAME" --key-id "$RELEASE_KEY_ID" --key "$keyfile" dist
          # prove the signature verifies against the PUBLIC key committed in the repo before publishing
          openssl pkeyutl -verify -pubin -inkey install/release-signing.pub.pem -rawin \
            -in dist/checksums.txt -sigfile dist/checksums.txt.sig
          if [ -f install/keys/keys.txt ]; then cp install/keys/keys.txt install/keys/keys.txt.sig.* dist/; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
