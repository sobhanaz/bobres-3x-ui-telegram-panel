name: Release

# Triggered by pushing a tag like v0.1.0. Publishes signed multi-arch images to ghcr.io
# and attaches CLI binaries + checksums to a GitHub release. The release is created last,
# only once every image is pushed, public and signed: the CLI carries the images' digests
# (its install pins them), and its checksum is signed with the Ed25519 release key.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign signing

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BOBRES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      BOBRES_TEST_REDIS_ADDR: localhost:6379
      BOBRES_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x" # latest patch, see ci.yml
          check-latest: true
          cache: true
      - run: go test -race -count=1 ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: |
          "$(go env GOPATH)/bin/govulncheck" -format json ./... > govulncheck.json
          tools/ci/vulncheck-gate.sh govulncheck.json .govulncheck-allow

  images:
    name: Image ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [core, bot, payments, provisioner, backup]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bobres-${{ matrix.service }}
          # A pre-release tag (v0.1.0-rc.1) must not move "latest".
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          # The backup image is its own target (pg_dump); the others use the last stage.
          target: ${{ matrix.service == 'backup' && 'backup' || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/bobres-${{ matrix.service }}@${{ steps.build.outputs.digest }}

  cli:
    name: CLI binaries + release
    # After EVERY image, not beside them: a release published while an image build failed
    # would be GitHub's latest, so install.sh would install a CLI whose `bobres install`
    # cannot pull its images, and every store's `bobres update` would fail and roll back.
    needs: [verify, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x" # latest patch, see ci.yml
          check-latest: true
          cache: true
      - uses: sigstore/cosign-installer@v3
      - name: Check the images and record their digests
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          identity="https://github.com/${REPO}/.github/workflows/release.yml@${GITHUB_REF}"
          digests=""
          for svc in core bot payments provisioner backup; do
            ref="ghcr.io/${OWNER}/bobres-${svc}"
            # Without logging in, as a store pulls it: this fails while the package is still
            # private (make each ghcr.io package public once, then re-run the failed jobs).
            digest="$(docker buildx imagetools inspect "${ref}:${ver}" --format '{{json .Manifest}}' | jq -r .digest)"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${ref}:${ver} cannot be pulled anonymously (digest '${digest}')"; exit 1
            fi
            # Signed by this workflow for this tag (the images job), so the digest the CLI
            # pins below is the image that was built and signed here.
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "${ref}@${digest}" >/dev/null
            echo "${ref}:${ver}@${digest}"
            digests="${digests:+${digests},}${svc}=${digest}"
          done
          echo "digests=${digests}" >> "$GITHUB_OUTPUT"
      - name: Build bobres for all platforms
        env:
          IMAGE_DIGESTS: ${{ steps.images.outputs.digests }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # main.imageDigests: `bobres install` runs each image by its digest (cmd/bobres/images.go),
          # and the CLI is covered by the signed checksums below.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/sobhanaz/bobres-3x-ui-telegram-panel/internal/version.Version=${GITHUB_REF_NAME} -X main.imageDigests=${IMAGE_DIGESTS}" \
              -o "dist/bobres_${os}_${arch}" ./cmd/bobres
          done
          # Exit 1 unless the CLI pins all five images.
          dist/bobres_linux_amd64 version --images
      - name: Sign checksums (Ed25519)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_KEY_ID: ${{ vars.RELEASE_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          test -n "$RELEASE_KEY_ID" || { echo "RELEASE_KEY_ID repo variable is not set"; exit 1; }
          # A pre-release tag (v0.1.0-rc.1) is signed for the beta channel: on the stable channel
          # bobres update and the bot's check refuse it, even if it ends up as the latest
          # release. The same test marks it --prerelease below.
          channel=stable
          case "$GITHUB_REF_NAME" in *-*) channel=beta ;; esac
          tools/sign/sign.sh --version "$GITHUB_REF_NAME" --channel "$channel" --key-id "$RELEASE_KEY_ID" --key "$keyfile" dist
          # prove the signature verifies against the PUBLIC key committed in the repo before publishing
          openssl pkeyutl -verify -pubin -inkey install/release-signing.pub.pem -rawin \
            -in dist/checksums.txt -sigfile dist/checksums.txt.sig
          if [ -f install/keys/keys.txt ]; then cp install/keys/keys.txt install/keys/keys.txt.sig.* dist/; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME" $pre
