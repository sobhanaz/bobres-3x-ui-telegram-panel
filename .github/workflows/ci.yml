name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (race)
    runs-on: ubuntu-latest
    # Database and Redis tests must RUN in CI: with BOBRES_TEST_REQUIRE_DB=1 a
    # missing service fails the job instead of silently skipping those tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BOBRES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      BOBRES_TEST_REDIS_ADDR: localhost:6379
      BOBRES_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.26 patch: go.mod's "go 1.26.0" is the minimum language
          # version, not the toolchain to ship.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.26 patch: go.mod's "go 1.26.0" is the minimum language
          # version, not the toolchain to ship.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      # Built from source with the job's Go toolchain: golangci-lint must be built with
      # a Go at least as new as go.mod's go line, and only v2 (>= v2.10) handles Go 1.26.
      # Keep this version in sync with GOLANGCI_LINT_VERSION in the Makefile.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Lint
        run: '"$(go env GOPATH)/bin/golangci-lint" run ./...'

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.26 patch: go.mod's "go 1.26.0" is the minimum language
          # version, not the toolchain to ship.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      # govulncheck v1.8.0 builds with the job's Go 1.26; a newer release may pull a
      # newer toolchain through the default GOTOOLCHAIN=auto, which is fine for a scanner.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Fails on any vulnerability our code calls, except reviewed entries in .govulncheck-allow.
      - name: Scan
        run: |
          "$(go env GOPATH)/bin/govulncheck" -format json ./... > govulncheck.json
          tools/ci/vulncheck-gate.sh govulncheck.json .govulncheck-allow

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.26 patch: go.mod's "go 1.26.0" is the minimum language
          # version, not the toolchain to ship.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - run: make build

  dashboard:
    name: Dashboard (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Fails on a known vulnerability in anything that ships to the browser.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  shell:
    name: Shell lint + signing tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --severity=warning install/install.sh tools/sign/*.sh tools/ci/*.sh tests/*.sh deploy/postgres-init.sh
      - run: bash tests/sign_test.sh
      - run: bash tests/install_verify_test.sh

  docker:
    name: Docker images + compose + e2e install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: |
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example --profile backup config -q
      - name: Build service images
        # Tagged the way the compose file expects released images, so the e2e
        # install below runs exactly these builds (no pull). The backup image
        # is its own Dockerfile target (postgres:16-alpine, for pg_dump).
        run: |
          for s in core bot payments provisioner backup; do
            target=""
            if [ "$s" = backup ]; then target=backup; fi
            docker build -f deploy/Dockerfile ${target:+--target "$target"} --build-arg SERVICE=$s --build-arg VERSION=ci \
              -t bobres-$s:ci -t ghcr.io/sobhanaz/bobres-$s:ci .
          done
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e BOBRES_DOMAIN=panel.example.com caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      # The real installer against the real stack AND a real 3x-ui panel: the
      # owner sets up a plan and the trial, a customer takes the trial and buys
      # with wallet credit, all through the bot (fake Telegram on the runner),
      # and both VPN accounts must exist on the panel. Then status and logs; the
      # restore drill and both uninstall modes follow as their own steps.
      - name: End-to-end install against a real 3x-ui panel
        env:
          BOBRES_TELEGRAM_BOT_TOKEN: "123456789:AAH-ci-fake-token-abcdefghijklmnopqrstuv"
          # Pinned by digest: a re-pushed upstream tag must not change what CI tests.
          XUI_IMAGE: ghcr.io/mhsanaei/3x-ui:v3.9.0@sha256:93a7a68e3d0a65be1b02d2bfc1f3ca02d0e800516a403e103cea2d7c7090855d
        run: |
          set -euo pipefail
          go build -o /tmp/bobres ./cmd/bobres
          go build -o /tmp/tgfake ./tools/tgfake
          go build -o /tmp/xuidev ./tools/xuidev
          /tmp/tgfake -addr 0.0.0.0:8081 > /tmp/tgfake.log 2>&1 &
          # Host networking: the panel is "on this server", reachable from the
          # stack as host.docker.internal, like a co-located production panel.
          docker run -d --name xui --network host -e XUI_ENABLE_FAIL2BAN=false "$XUI_IMAGE"
          xui_token=$(/tmp/xuidev -url http://127.0.0.1:2053)
          echo "::add-mask::$xui_token"
          dir="$RUNNER_TEMP/bobres"
          BOBRES_XUI_TOKEN="$xui_token" /tmp/bobres install --dir "$dir" --domain ci.example.test --admin-id 4242 \
            --xui-url http://host.docker.internal:2053 --xui-sub-url https://sub.example.test/sub/ \
            --xui-allow-private --version ci --skip-checks --offline --no-start
          echo "BOBRES_TELEGRAM_API_URL=http://host.docker.internal:8081" >> "$dir/.env"
          # Re-run: keeps the secrets, starts the stack, waits until every service is healthy.
          /tmp/bobres install --dir "$dir" --skip-checks --offline
          /tmp/bobres status --dir "$dir"
          /tmp/bobres logs --dir "$dir" --tail 20 core
          BOBRES_E2E_REQUIRE=1 BOBRES_E2E_TELEGRAM=http://127.0.0.1:8081 BOBRES_E2E_ADMIN_ID=4242 \
          BOBRES_E2E_SUB_BASE=https://sub.example.test/sub/ \
          XUI_TEST_URL=http://127.0.0.1:2053 XUI_TEST_TOKEN="$xui_token" XUI_TEST_ALLOW_PRIVATE=1 \
            go test -tags e2e -count=1 -v ./tests/e2e/
      # The restore drill on the real stack, with the store the e2e test filled:
      # back up, write a marker row, restore that backup, and the marker must be
      # gone, the data from before intact and every service healthy. The CLI
      # runs as root here, as on a real server: the installer gives the backups
      # directory to the backup service's user (65532) only when run as root.
      - name: Restore drill (backup, change, restore)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bobres"
          fail() { echo "::error title=Restore drill::$*"; exit 1; }
          # The database's superuser is POSTGRES_USER (bobres); there is no postgres role.
          sql() {
            (cd "$dir" && sudo docker compose --project-name bobres -f docker-compose.yml --env-file .env \
              exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -Atq -U "$POSTGRES_USER" -d "$POSTGRES_DB"')
          }
          # Hand the install back to the runner afterwards, also on failure, for
          # the log dump and the uninstall steps.
          trap 'sudo chown -R "$(id -u):$(id -g)" "$dir"' EXIT
          sudo chown 65532:65532 "$dir/backups"
          counts="SELECT format('%s users, %s orders, %s subscriptions', (SELECT count(*) FROM core.users),
            (SELECT count(*) FROM core.orders), (SELECT count(*) FROM core.subscriptions))"
          marker="SELECT count(*) FROM core.users WHERE telegram_id = 990001"
          before=$(echo "$counts" | sql)
          echo "Before the backup: $before"
          case "$before" in 0\ users*) fail "the store is empty: the e2e test should have filled it" ;; esac

          out=$(sudo /tmp/bobres backup --dir "$dir" 2>&1) || { echo "$out"; fail "bobres backup failed"; }
          echo "$out"
          file=$(echo "$out" | sed -n 's/^Backup \(bobres-[0-9]\{8\}T[0-9]\{6\}Z\.bkp\) written.*/\1/p')
          [ -n "$file" ] || fail "bobres backup did not name the file it wrote"
          echo "$out" | grep -q '^Sent to the owner on Telegram' || fail "the backup was not sent to the owner (fake Telegram)"

          echo "INSERT INTO core.users (id, telegram_id) VALUES ('00000000-0000-0000-0000-00000000d001', 990001)" | sql
          [ "$(echo "$marker" | sql)" = 1 ] || fail "the marker row was not written"
          backups=$(sudo find "$dir/backups" -name 'bobres-*.bkp' | wc -l)

          sudo /tmp/bobres restore "$dir/backups/$file" --dir "$dir" --yes || fail "bobres restore $file failed (see its output above)"

          [ "$(echo "$marker" | sql)" = 0 ] || fail "the marker row written after the backup is still there after the restore"
          after=$(echo "$counts" | sql)
          [ "$after" = "$before" ] || fail "after the restore the store has $after; the backup had $before"
          [ "$(sudo find "$dir/backups" -name 'bobres-*.bkp' | wc -l)" -gt "$backups" ] || fail "bobres restore kept no safety backup of the store it replaced"
          [ "$(sudo stat -c %a "$dir/.env")" = 600 ] || fail ".env is not mode 600 after the restore"
          sudo /tmp/bobres status --dir "$dir" || fail "the stack is not healthy after the restore"
          echo "Restore drill passed: $after, marker gone, safety backup kept."
      - name: Uninstall (keep the data, then purge)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bobres"
          /tmp/bobres uninstall --dir "$dir" --yes
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=bobres)"
          docker volume ls -q | grep -q '^bobres_pg_data$'
          /tmp/bobres uninstall --dir "$dir" --purge --yes
          test ! -e "$dir"
          ! docker volume ls -q | grep -q '^bobres_'
      - name: Dump logs on failure
        if: failure()
        run: |
          cd "$RUNNER_TEMP/bobres" 2>/dev/null && docker compose --project-name bobres -f docker-compose.yml --env-file .env ps --all || true
          cd "$RUNNER_TEMP/bobres" 2>/dev/null && docker compose --project-name bobres -f docker-compose.yml --env-file .env logs --tail 200 || true
          # The backups and their records (file, size, checksum, error; no secrets).
          sudo ls -la "$RUNNER_TEMP/bobres/backups" || true
          sudo sh -c 'cat "$1"/backups/*.json' sh "$RUNNER_TEMP/bobres" || true
          cat /tmp/tgfake.log || true
          curl -fsS localhost:8081/_sent || true
          docker logs --tail 100 xui || true

  # Our 3x-ui adapter against REAL panels: the version PLAN.md was written
  # against and the newest release, pinned by digest. Add a version here when
  # upstream ships one, and change .github/rulesets/protect-main.json with it
  # (each matrix entry is a required check there).
  xui:
    name: 3x-ui integration (${{ matrix.xui }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - xui: v3.8.5
            digest: sha256:e0f90c10902e0e74f947d5a9efe017b273804477430233bbfc4918542ffe366c
          - xui: v3.9.0
            digest: sha256:93a7a68e3d0a65be1b02d2bfc1f3ca02d0e800516a403e103cea2d7c7090855d
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: Start a real 3x-ui panel
        run: docker run -d --name xui -p 127.0.0.1:2053:2053 -e XUI_ENABLE_FAIL2BAN=false "ghcr.io/mhsanaei/3x-ui:${{ matrix.xui }}@${{ matrix.digest }}"
      - name: Adapter against the panel
        run: |
          set -euo pipefail
          token=$(go run ./tools/xuidev -url http://127.0.0.1:2053)
          echo "::add-mask::$token"
          XUI_TEST_REQUIRE=1 XUI_TEST_URL=http://127.0.0.1:2053 XUI_TEST_TOKEN="$token" XUI_TEST_ALLOW_PRIVATE=1 \
            go test -tags integration -count=1 -v -run Integration ./internal/provisioner/adapter/
      - name: Panel logs on failure
        if: failure()
        run: docker logs --tail 200 xui || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks lists the commits of a pull request through the API, which needs this scope.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
