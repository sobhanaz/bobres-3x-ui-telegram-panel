name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (race)
    runs-on: ubuntu-latest
    # Database and Redis tests must RUN in CI: with BOBRES_TEST_REQUIRE_DB=1 a
    # missing service fails the job instead of silently skipping those tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BOBRES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      BOBRES_TEST_REDIS_ADDR: localhost:6379
      BOBRES_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.26 patch: go.mod's "go 1.26.0" is the minimum language
          # version, not the toolchain to ship.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.26 patch: go.mod's "go 1.26.0" is the minimum language
          # version, not the toolchain to ship.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      # Built from source with the job's Go toolchain: golangci-lint must be built with
      # a Go at least as new as go.mod's go line, and only v2 (>= v2.10) handles Go 1.26.
      # Keep this version in sync with GOLANGCI_LINT_VERSION in the Makefile.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Lint
        run: '"$(go env GOPATH)/bin/golangci-lint" run ./...'

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.26 patch: go.mod's "go 1.26.0" is the minimum language
          # version, not the toolchain to ship.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      # govulncheck v1.8.0 builds with the job's Go 1.26; a newer release may pull a
      # newer toolchain through the default GOTOOLCHAIN=auto, which is fine for a scanner.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Fails on any vulnerability our code calls, except reviewed entries in .govulncheck-allow.
      - name: Scan
        run: |
          "$(go env GOPATH)/bin/govulncheck" -format json ./... > govulncheck.json
          tools/ci/vulncheck-gate.sh govulncheck.json .govulncheck-allow

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.26 patch: go.mod's "go 1.26.0" is the minimum language
          # version, not the toolchain to ship.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - run: make build

  shell:
    name: Shell lint + signing tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --severity=warning install/install.sh tools/sign/*.sh tools/ci/*.sh tests/*.sh deploy/postgres-init.sh
      - run: bash tests/sign_test.sh
      - run: bash tests/install_verify_test.sh

  docker:
    name: Docker images + compose + e2e install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q
      - name: Build service images
        # Tagged the way the compose file expects released images, so the e2e
        # install below runs exactly these builds (no pull).
        run: |
          for s in core bot payments provisioner; do
            docker build -f deploy/Dockerfile --build-arg SERVICE=$s --build-arg VERSION=ci \
              -t bobres-$s:ci -t ghcr.io/sobhanaz/bobres-$s:ci .
          done
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e BOBRES_DOMAIN=panel.example.com caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      # The real installer against the real stack: `bobres install` writes
      # /opt-style files, starts the compose project and waits for health; the
      # bot talks to a fake Telegram on the runner and answers a /start through
      # core and Postgres; then status, logs and both uninstall modes.
      - name: End-to-end install
        env:
          BOBRES_TELEGRAM_BOT_TOKEN: "123456789:AAH-ci-fake-token-abcdefghijklmnopqrstuv"
          BOBRES_XUI_TOKEN: ci-panel-token
        run: |
          set -euo pipefail
          go build -o /tmp/bobres ./cmd/bobres
          go build -o /tmp/tgfake ./tools/tgfake
          /tmp/tgfake -addr 0.0.0.0:8081 > /tmp/tgfake.log 2>&1 &
          dir="$RUNNER_TEMP/bobres"
          /tmp/bobres install --dir "$dir" --domain ci.example.test --admin-id 4242 \
            --xui-url https://127.0.0.1:1/ --xui-allow-private --version ci \
            --skip-checks --offline --no-start
          echo "BOBRES_TELEGRAM_API_URL=http://host.docker.internal:8081" >> "$dir/.env"
          # Re-run: keeps the secrets, starts the stack, waits until every service is healthy.
          /tmp/bobres install --dir "$dir" --skip-checks --offline
          /tmp/bobres status --dir "$dir"
          /tmp/bobres logs --dir "$dir" --tail 20 core
          curl -fsS -X POST localhost:8081/_inject -H 'Content-Type: application/json' \
            -d '{"message":{"message_id":1,"date":0,"chat":{"id":4242,"type":"private"},"from":{"id":4242,"is_bot":false,"first_name":"CI","language_code":"en"},"text":"/start"}}'
          for _ in $(seq 1 30); do
            if curl -fsS localhost:8081/_sent | grep -q "Choose your language"; then break; fi
            sleep 2
          done
          curl -fsS localhost:8081/_sent | grep -q "Choose your language" || { echo "the bot did not answer /start"; exit 1; }
          echo "bot answered /start through core"
          /tmp/bobres uninstall --dir "$dir" --yes
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=bobres)"
          docker volume ls -q | grep -q '^bobres_pg_data$'
          /tmp/bobres uninstall --dir "$dir" --purge --yes
          test ! -e "$dir"
          ! docker volume ls -q | grep -q '^bobres_'
      - name: Dump logs on failure
        if: failure()
        run: |
          cd "$RUNNER_TEMP/bobres" 2>/dev/null && docker compose --project-name bobres -f docker-compose.yml --env-file .env ps --all || true
          cd "$RUNNER_TEMP/bobres" 2>/dev/null && docker compose --project-name bobres -f docker-compose.yml --env-file .env logs --tail 200 || true
          cat /tmp/tgfake.log || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks lists the commits of a pull request through the API, which needs this scope.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
