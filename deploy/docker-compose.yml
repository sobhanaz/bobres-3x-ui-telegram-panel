# BOBRES stack. Run via `bobres` (or docker compose --env-file .env up -d).
#
# Networks
#   edge    : caddy <-> services that receive public HTTP (core, payments)
#   backend : internal-only (no internet, not reachable from host): postgres, redis, all apps
#   egress  : outbound internet for services that call Telegram / gateways / 3x-ui
# Secrets: each service gets ONLY what it needs (no shared env_file).

x-app: &app
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test: ["CMD", "/app", "--healthcheck"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-common-env: &common-env
  BOBRES_ENV: ${BOBRES_ENV:-prod}
  BOBRES_LOG_LEVEL: ${BOBRES_LOG_LEVEL:-info}
  BOBRES_LOG_FORMAT: ${BOBRES_LOG_FORMAT:-json}
  BOBRES_SERVICE_TOKEN: ${BOBRES_SERVICE_TOKEN:?set BOBRES_SERVICE_TOKEN}

x-build: &build
  context: ..
  dockerfile: deploy/Dockerfile

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      BOBRES_DOMAIN: ${BOBRES_DOMAIN:?set BOBRES_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      core: { condition: service_healthy }
      payments: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: bobres
      POSTGRES_DB: bobres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bobres -d bobres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: redis   # volume is owned by redis; running non-root needs no extra capabilities
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  core:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-core:${BOBRES_VERSION:-latest}
    build: { <<: *build, args: { SERVICE: core, VERSION: "${BOBRES_VERSION:-dev}" } }
    environment:
      <<: *common-env
      BOBRES_DATABASE_URL: ${BOBRES_DATABASE_URL:?set BOBRES_DATABASE_URL}
      BOBRES_REDIS_URL: ${BOBRES_REDIS_URL:?set BOBRES_REDIS_URL}
      BOBRES_DOMAIN: ${BOBRES_DOMAIN}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [edge, backend]

  bot:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-bot:${BOBRES_VERSION:-latest}
    build: { <<: *build, args: { SERVICE: bot, VERSION: "${BOBRES_VERSION:-dev}" } }
    environment:
      <<: *common-env
      BOBRES_REDIS_URL: ${BOBRES_REDIS_URL:?set BOBRES_REDIS_URL}
      BOBRES_BOT_TOKEN: ${BOBRES_BOT_TOKEN:?set BOBRES_BOT_TOKEN}
      BOBRES_ADMIN_TELEGRAM_ID: ${BOBRES_ADMIN_TELEGRAM_ID:-}
    depends_on:
      core: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend, egress]

  payments:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-payments:${BOBRES_VERSION:-latest}
    build: { <<: *build, args: { SERVICE: payments, VERSION: "${BOBRES_VERSION:-dev}" } }
    environment:
      <<: *common-env
      BOBRES_DATABASE_URL: ${BOBRES_DATABASE_URL:?set BOBRES_DATABASE_URL}
      BOBRES_DOMAIN: ${BOBRES_DOMAIN}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [edge, backend, egress]

  provisioner:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-provisioner:${BOBRES_VERSION:-latest}
    build: { <<: *build, args: { SERVICE: provisioner, VERSION: "${BOBRES_VERSION:-dev}" } }
    environment:
      <<: *common-env
      BOBRES_DATABASE_URL: ${BOBRES_DATABASE_URL:?set BOBRES_DATABASE_URL}
      BOBRES_XUI_URL: ${BOBRES_XUI_URL:?set BOBRES_XUI_URL}
      BOBRES_XUI_TOKEN: ${BOBRES_XUI_TOKEN:?set BOBRES_XUI_TOKEN}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend, egress]

networks:
  edge: {}
  backend:
    internal: true
  egress: {}

volumes:
  pg_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
