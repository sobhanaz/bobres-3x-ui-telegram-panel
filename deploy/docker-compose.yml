# BOBRES stack. Run via `bobres` (or docker compose --env-file .env up -d).
#
# Networks
#   public  : caddy only (the only container with a route to the internet inbound)
#   edge    : INTERNAL. caddy <-> services that receive public HTTP (core, payments).
#             core has NO internet egress: a compromised dashboard cannot phone home.
#   backend : INTERNAL. postgres, redis and all apps.
#   egress  : outbound internet, only for services that must call Telegram / gateways / 3x-ui
#             (bot, payments, provisioner).
# Secrets: each service gets ONLY what it needs (no shared env_file), its OWN database role
# and its OWN service token. A server accepts only its legitimate callers: core accepts the
# bot; payments and provisioner accept only core.

x-app: &app
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test: ["CMD", "/app", "--healthcheck"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  mem_limit: 512m
  pids_limit: 256
  ulimits: { nofile: { soft: 4096, hard: 4096 } }
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-common-env: &common-env
  BOBRES_ENV: ${BOBRES_ENV:-prod}
  BOBRES_LOG_LEVEL: ${BOBRES_LOG_LEVEL:-info}
  BOBRES_LOG_FORMAT: ${BOBRES_LOG_FORMAT:-json}

x-build: &build
  context: ..
  dockerfile: deploy/Dockerfile

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      BOBRES_DOMAIN: ${BOBRES_DOMAIN:?set BOBRES_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    pids_limit: 256
    networks: [public, edge]
    depends_on:
      core: { condition: service_healthy }
      payments: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: bobres
      POSTGRES_DB: bobres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_CORE_PASSWORD: ${DB_CORE_PASSWORD:?set DB_CORE_PASSWORD}
      DB_PAYMENTS_PASSWORD: ${DB_PAYMENTS_PASSWORD:?set DB_PAYMENTS_PASSWORD}
      DB_PROVISIONER_PASSWORD: ${DB_PROVISIONER_PASSWORD:?set DB_PROVISIONER_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    mem_limit: 1g
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bobres -d bobres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: redis   # volume is owned by redis; running non-root needs no extra capabilities
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redis_data:/data]
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  core:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-core:${BOBRES_VERSION:-latest}
    build: { <<: *build, args: { SERVICE: core, VERSION: "${BOBRES_VERSION:-dev}" } }
    environment:
      <<: *common-env
      BOBRES_DATABASE_URL: postgres://svc_core:${DB_CORE_PASSWORD}@postgres:5432/bobres?sslmode=disable
      BOBRES_DOMAIN: ${BOBRES_DOMAIN}
      BOBRES_SERVICE_TOKEN: ${BOBRES_TOKEN_CORE:?set BOBRES_TOKEN_CORE}
      BOBRES_PEER_BOT_TOKEN: ${BOBRES_TOKEN_BOT:?set BOBRES_TOKEN_BOT}
      BOBRES_PAYMENTS_GRPC_ADDR: payments:9090
      BOBRES_PROVISIONER_GRPC_ADDR: provisioner:9090
      BOBRES_MASTER_KEY: ${BOBRES_CORE_MASTER_KEY:?set BOBRES_CORE_MASTER_KEY}
      BOBRES_ADMIN_TELEGRAM_ID: ${BOBRES_ADMIN_TELEGRAM_ID:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [edge, backend]

  bot:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-bot:${BOBRES_VERSION:-latest}
    build: { <<: *build, args: { SERVICE: bot, VERSION: "${BOBRES_VERSION:-dev}" } }
    environment:
      <<: *common-env
      BOBRES_REDIS_URL: ${BOBRES_REDIS_URL:?set BOBRES_REDIS_URL}
      BOBRES_SERVICE_TOKEN: ${BOBRES_TOKEN_BOT:?set BOBRES_TOKEN_BOT}
      BOBRES_CORE_GRPC_ADDR: core:9090
      BOBRES_TELEGRAM_BOT_TOKEN: ${BOBRES_TELEGRAM_BOT_TOKEN:?set BOBRES_TELEGRAM_BOT_TOKEN}
      BOBRES_ADMIN_TELEGRAM_ID: ${BOBRES_ADMIN_TELEGRAM_ID:-}
      BOBRES_TIMEZONE: ${BOBRES_TIMEZONE:-Asia/Tehran}
      # Empty = long polling (no domain needed). Set both to receive updates by webhook
      # at https://<domain>/tg/webhook (routed by Caddy).
      BOBRES_TELEGRAM_WEBHOOK_URL: ${BOBRES_TELEGRAM_WEBHOOK_URL:-}
      BOBRES_TELEGRAM_WEBHOOK_SECRET: ${BOBRES_TELEGRAM_WEBHOOK_SECRET:-}
      # Empty = api.telegram.org. A local Bot API server on this host is reachable
      # as http://host.docker.internal:<port> (see extra_hosts).
      BOBRES_TELEGRAM_API_URL: ${BOBRES_TELEGRAM_API_URL:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      core: { condition: service_healthy }
      redis: { condition: service_healthy }
    # edge: only so Caddy can deliver webhook updates to /tg/webhook.
    networks: [edge, backend, egress]

  payments:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-payments:${BOBRES_VERSION:-latest}
    build: { <<: *build, args: { SERVICE: payments, VERSION: "${BOBRES_VERSION:-dev}" } }
    environment:
      <<: *common-env
      BOBRES_DATABASE_URL: postgres://svc_payments:${DB_PAYMENTS_PASSWORD}@postgres:5432/bobres?sslmode=disable
      BOBRES_DOMAIN: ${BOBRES_DOMAIN}
      BOBRES_PEER_CORE_TOKEN: ${BOBRES_TOKEN_CORE:?set BOBRES_TOKEN_CORE}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [edge, backend, egress]

  provisioner:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-provisioner:${BOBRES_VERSION:-latest}
    build: { <<: *build, args: { SERVICE: provisioner, VERSION: "${BOBRES_VERSION:-dev}" } }
    environment:
      <<: *common-env
      BOBRES_DATABASE_URL: postgres://svc_provisioner:${DB_PROVISIONER_PASSWORD}@postgres:5432/bobres?sslmode=disable
      BOBRES_PEER_CORE_TOKEN: ${BOBRES_TOKEN_CORE:?set BOBRES_TOKEN_CORE}
      BOBRES_MASTER_KEY: ${BOBRES_PROVISIONER_MASTER_KEY:?set BOBRES_PROVISIONER_MASTER_KEY}
      # First panel, registered on first start (later changes go through the dashboard).
      BOBRES_XUI_URL: ${BOBRES_XUI_URL:?set BOBRES_XUI_URL}
      BOBRES_XUI_TOKEN: ${BOBRES_XUI_TOKEN:?set BOBRES_XUI_TOKEN}
      BOBRES_XUI_SUB_URL: ${BOBRES_XUI_SUB_URL:-}
      BOBRES_XUI_ALLOW_PRIVATE: ${BOBRES_XUI_ALLOW_PRIVATE:-false}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend, egress]

networks:
  public: {}
  edge:
    internal: true
  backend:
    internal: true
  egress: {}

volumes:
  pg_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
