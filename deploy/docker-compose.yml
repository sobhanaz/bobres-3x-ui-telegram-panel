# BOBRES stack. Run via `bobres` (or docker compose --env-file .env up -d).
#
# Networks
#   public  : caddy only (the only container with a route to the internet inbound)
#   edge    : INTERNAL. caddy <-> services that receive public HTTP (core, payments).
#             core has NO internet egress: a compromised dashboard cannot phone home.
#             It does not control the gateway either: HTTPS changes go through the tls-agent
#             (below), which has no network at all.
#   backend : INTERNAL. postgres, redis and all apps.
#   egress  : outbound internet, only for services that must call Telegram / gateways / 3x-ui
#             (bot, payments, provisioner), and the backup service while it copies backups to
#             S3-compatible storage (BOBRES_BACKUP_NETWORK=egress, set with the S3 endpoint).
#   offline : INTERNAL, the backup service alone: its second network when it has no S3 copy.
# Images
#   Each BOBRES image runs by its tag plus BOBRES_IMAGE_DIGEST_<SERVICE> ("@sha256:..."), which
#   `bobres install` sets from the digests the signed release CLI carries: a tag moved on the
#   registry cannot change what runs. Empty (a development build, or --version of another
#   release) = by tag.
# HTTPS (the dashboard's System > HTTPS tab, `bobres ssl`)
#   Core checks a change and hands it to the tls-agent as a request file (volume tls_request, core
#   writes, the agent reads); the agent checks it again, writes the Caddy files in ./tls (the only
#   service that can), makes Caddy load them through its admin socket (volume caddy_admin: only
#   caddy and the agent mount it) and answers in a result file (volume tls_result, the agent writes,
#   core reads). Caddy reads ./caddy (its main Caddyfile) and ./tls read-only.
# Host monitoring (the dashboard's Monitoring section, `bobres monitor`)
#   A root helper on the host writes <install>/run/monitor/snapshot.json every 30 seconds (two systemd
#   units that `bobres install` and `bobres update` put in place). Core mounts that directory read-only
#   and reads the file, whose fields are allow-listed and which it validates again. No container gets
#   the Docker socket.
# Profiles
#   backup  : the backup service. `bobres install` turns it on (COMPOSE_PROFILES=backup in .env)
#             when the install runs images that have it and off when they do not, so an
#             install pinned (or rolled back) to an older version, which has no backup image,
#             still starts.
#   tls     : the tls-agent, the same way (COMPOSE_PROFILES=...,tls in .env): on for images that
#             have the `tls-agent` command (0.1.0-rc.2 on; a tag that names no release counts as
#             having it), off for older ones (0.1.0-rc.1), where the service would restart for ever.
# Secrets: each service gets ONLY what it needs (no shared env_file), its OWN database role
# and its OWN service token. A server accepts only its legitimate callers: core accepts the
# bot; payments and provisioner accept only core; the bot's /internal endpoints accept core and
# the backup service. Core presents a different token to each service it calls (payments
# BOBRES_TOKEN_CORE, provisioner BOBRES_TOKEN_CORE_PROVISIONER, the bot BOBRES_TOKEN_CORE_BOT,
# the backup service BOBRES_TOKEN_CORE_BACKUP), so no container holds a token another one
# accepts as core: a compromised bot cannot change the payment gateways or delete VPN accounts,
# and a compromised payments cannot send messages as the bot or reach provisioner.

x-app: &app
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test: ["CMD", "/app", "--healthcheck"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  mem_limit: 512m
  pids_limit: 256
  ulimits: { nofile: { soft: 4096, hard: 4096 } }
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-common-env: &common-env
  BOBRES_ENV: ${BOBRES_ENV:-prod}
  BOBRES_LOG_LEVEL: ${BOBRES_LOG_LEVEL:-info}
  BOBRES_LOG_FORMAT: ${BOBRES_LOG_FORMAT:-json}

x-build: &build
  context: ..
  dockerfile: deploy/Dockerfile

services:
  caddy:
    # Pinned by tag and by digest (the multi-arch index): 2.11.3 is the first version that issues
    # Let's Encrypt certificates for IP addresses. A new reference is pulled by `bobres update`.
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    # Root (it binds 80/443), with group 65532, the group of the tls-agent and of the files it writes
    # (mode 0640): Caddy reads them through the group, and the agent writes to the admin socket
    # (mode 0220) through it. Without DAC_OVERRIDE root has no other power over those files.
    user: "0:65532"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      BOBRES_DOMAIN: ${BOBRES_DOMAIN:?set BOBRES_DOMAIN}
      BOBRES_ZARINPAL_HOST: ${BOBRES_ZARINPAL_HOST:-}
    volumes:
      # A directory, not the file: a bind-mounted file keeps its old inode when the installer replaces
      # it (an atomic rename), so an updated Caddyfile would never reach the container.
      - ./caddy:/etc/caddy:ro
      # The HTTPS files the tls-agent writes (imported by the Caddyfile), and a manual certificate.
      - ./tls:/tls:ro
      # Caddy's admin socket. Whoever can write to it controls the gateway: only the tls-agent mounts it.
      - caddy_admin:/run/caddy
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    pids_limit: 256
    networks: [public, edge]
    depends_on:
      core: { condition: service_healthy }
      payments: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: bobres
      POSTGRES_DB: bobres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_CORE_PASSWORD: ${DB_CORE_PASSWORD:?set DB_CORE_PASSWORD}
      DB_PAYMENTS_PASSWORD: ${DB_PAYMENTS_PASSWORD:?set DB_PAYMENTS_PASSWORD}
      DB_PROVISIONER_PASSWORD: ${DB_PROVISIONER_PASSWORD:?set DB_PROVISIONER_PASSWORD}
      # The backup service's read-only role (postgres-init.sh; `bobres install` creates it
      # on an existing database). Empty = no such role.
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:-}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    mem_limit: 1g
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bobres -d bobres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    user: redis   # volume is owned by redis; running non-root needs no extra capabilities
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redis_data:/data]
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  core:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-core:${BOBRES_VERSION:-latest}${BOBRES_IMAGE_DIGEST_CORE:-}
    build: { <<: *build, args: { SERVICE: core, VERSION: "${BOBRES_VERSION:-dev}" } }
    environment:
      <<: *common-env
      BOBRES_DATABASE_URL: postgres://svc_core:${DB_CORE_PASSWORD}@postgres:5432/bobres?sslmode=disable
      BOBRES_DOMAIN: ${BOBRES_DOMAIN}
      # Optional: whom the dashboard's License tab and `bobres license status` tell the owner to ask
      # to buy or renew a license ("" = "ask the seller you got BOBRES from").
      BOBRES_SELLER_CONTACT: ${BOBRES_SELLER_CONTACT:-}
      # Optional: where staff open the dashboard, when not https://BOBRES_DOMAIN (local tests).
      BOBRES_PUBLIC_URL: ${BOBRES_PUBLIC_URL:-}
      # The second domain registered with Zarinpal ("" = none): part of the HTTPS setting core
      # hands to the tls-agent.
      BOBRES_ZARINPAL_HOST: ${BOBRES_ZARINPAL_HOST:-}
      # What core presents to payments (its own token), to provisioner and to the bot: one each.
      BOBRES_SERVICE_TOKEN: ${BOBRES_TOKEN_CORE:?set BOBRES_TOKEN_CORE}
      BOBRES_PROVISIONER_TOKEN: ${BOBRES_TOKEN_CORE_PROVISIONER:?set BOBRES_TOKEN_CORE_PROVISIONER}
      BOBRES_BOT_INTERNAL_TOKEN: ${BOBRES_TOKEN_CORE_BOT:?set BOBRES_TOKEN_CORE_BOT}
      BOBRES_PEER_BOT_TOKEN: ${BOBRES_TOKEN_BOT:?set BOBRES_TOKEN_BOT}
      BOBRES_PAYMENTS_GRPC_ADDR: payments:9090
      BOBRES_PROVISIONER_GRPC_ADDR: provisioner:9090
      BOBRES_MASTER_KEY: ${BOBRES_CORE_MASTER_KEY:?set BOBRES_CORE_MASTER_KEY}
      BOBRES_ADMIN_TELEGRAM_ID: ${BOBRES_ADMIN_TELEGRAM_ID:-}
      # The store's time zone when the general.timezone setting is empty: the sales reports'
      # days follow it, as the bot's dates do.
      BOBRES_TIMEZONE: ${BOBRES_TIMEZONE:-Asia/Tehran}
      # Receipt photos for the dashboard come through the bot: core keeps no
      # bot token and has no internet access.
      BOBRES_BOT_URL: http://bot:8080
      # The System page asks the other services' /healthz and /readyz here.
      BOBRES_PAYMENTS_URL: http://payments:8080
      BOBRES_PROVISIONER_URL: http://provisioner:8080
      # http://backup:8080 where the backup profile is on (the installer sets both);
      # empty = the System page shows the backup service as not installed.
      BOBRES_BACKUP_URL: ${BOBRES_BACKUP_URL:-}
      # What core presents to the backup service: its own token for that one service.
      BOBRES_BACKUP_TOKEN: ${BOBRES_TOKEN_CORE_BACKUP:-}
      # Where core reads the host snapshot for the dashboard's Monitoring section (the mount below).
      BOBRES_MONITOR_DIR: /run/bobres-monitor
    volumes:
      # Core's request to the tls-agent (read-write), and the agent's answer (read-only). Core mounts
      # nothing of Caddy's: neither the admin socket nor the TLS files.
      - tls_request:/request
      - tls_result:/tls-result:ro
      # The host monitoring snapshot, READ-ONLY. `bobres monitor snapshot`, a root helper that a systemd
      # timer runs every 30 seconds (docs/06-installer.md, "Host monitoring"), writes snapshot.json there.
      # It is all core knows of the machine and of Docker: core has no Docker socket and never gets one.
      # `bobres install` makes the directory first, so that Docker does not make it as root.
      - ./run/monitor:/run/bobres-monitor:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [edge, backend]

  bot:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-bot:${BOBRES_VERSION:-latest}${BOBRES_IMAGE_DIGEST_BOT:-}
    build: { <<: *build, args: { SERVICE: bot, VERSION: "${BOBRES_VERSION:-dev}" } }
    environment:
      <<: *common-env
      BOBRES_REDIS_URL: ${BOBRES_REDIS_URL:?set BOBRES_REDIS_URL}
      BOBRES_SERVICE_TOKEN: ${BOBRES_TOKEN_BOT:?set BOBRES_TOKEN_BOT}
      BOBRES_CORE_GRPC_ADDR: core:9090
      BOBRES_TELEGRAM_BOT_TOKEN: ${BOBRES_TELEGRAM_BOT_TOKEN:?set BOBRES_TELEGRAM_BOT_TOKEN}
      # The token core presents to the bot only (receipt photos, test broadcasts, license
      # calls under /internal): never BOBRES_TOKEN_CORE, which payments accepts as core.
      BOBRES_PEER_CORE_TOKEN: ${BOBRES_TOKEN_CORE_BOT:?set BOBRES_TOKEN_CORE_BOT}
      # The backup service's token: it hands each encrypted backup to the bot for the
      # owner (/internal/backups/deliver). Empty = backups are not sent to Telegram.
      BOBRES_PEER_BACKUP_TOKEN: ${BOBRES_TOKEN_BACKUP:-}
      BOBRES_ADMIN_TELEGRAM_ID: ${BOBRES_ADMIN_TELEGRAM_ID:-}
      BOBRES_TIMEZONE: ${BOBRES_TIMEZONE:-Asia/Tehran}
      # Empty = long polling (no domain needed). Set both to receive updates by webhook
      # at https://<domain>/tg/webhook (routed by Caddy).
      BOBRES_TELEGRAM_WEBHOOK_URL: ${BOBRES_TELEGRAM_WEBHOOK_URL:-}
      BOBRES_TELEGRAM_WEBHOOK_SECRET: ${BOBRES_TELEGRAM_WEBHOOK_SECRET:-}
      # Empty = api.telegram.org. A local Bot API server on this host is reachable
      # as http://host.docker.internal:<port> (see extra_hosts).
      BOBRES_TELEGRAM_API_URL: ${BOBRES_TELEGRAM_API_URL:-}
      # The releases the update check (the dashboard's Updates tab) follows: stable, or
      # beta for pre-releases too. bobres update reads the same line from .env.
      BOBRES_UPDATE_CHANNEL: ${BOBRES_UPDATE_CHANNEL:-stable}
      # The vendor's license server (https only). Core has no internet access, so the
      # dashboard's "Activate with a license key" and core's daily license refresh go
      # through the bot to it. Empty = both answer "not set up". bobres license activate
      # reads the same line from .env.
      BOBRES_LICENSE_SERVER: ${BOBRES_LICENSE_SERVER:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      core: { condition: service_healthy }
      redis: { condition: service_healthy }
    # edge: only so Caddy can deliver webhook updates to /tg/webhook.
    networks: [edge, backend, egress]

  payments:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-payments:${BOBRES_VERSION:-latest}${BOBRES_IMAGE_DIGEST_PAYMENTS:-}
    build: { <<: *build, args: { SERVICE: payments, VERSION: "${BOBRES_VERSION:-dev}" } }
    environment:
      <<: *common-env
      BOBRES_DATABASE_URL: postgres://svc_payments:${DB_PAYMENTS_PASSWORD}@postgres:5432/bobres?sslmode=disable
      BOBRES_DOMAIN: ${BOBRES_DOMAIN}
      BOBRES_PUBLIC_URL: https://${BOBRES_DOMAIN}
      # Core's own token: only payments accepts it.
      BOBRES_PEER_CORE_TOKEN: ${BOBRES_TOKEN_CORE:?set BOBRES_TOKEN_CORE}
      # Encrypts the gateway settings saved from the dashboard (merchant id, proxy).
      # Optional so an install from before it still starts: without it Zarinpal runs
      # from the values below and cannot be changed in the dashboard.
      BOBRES_MASTER_KEY: ${BOBRES_PAYMENTS_MASTER_KEY:-}
      # Zarinpal (off unless a merchant id is set). With the key above these only seed
      # the dashboard's settings on the first start. See docs/11-staging-run.md.
      BOBRES_ZARINPAL_MERCHANT_ID: ${BOBRES_ZARINPAL_MERCHANT_ID:-}
      BOBRES_ZARINPAL_SANDBOX: ${BOBRES_ZARINPAL_SANDBOX:-false}
      BOBRES_ZARINPAL_PROXY: ${BOBRES_ZARINPAL_PROXY:-}
      BOBRES_ZARINPAL_PUBLIC_URL: ${BOBRES_ZARINPAL_PUBLIC_URL:-}
      # IDPay and NextPay (each off unless its API key is set; seeds only, like Zarinpal's).
      # Their return URLs are on the same public URL as Zarinpal's.
      BOBRES_IDPAY_API_KEY: ${BOBRES_IDPAY_API_KEY:-}
      BOBRES_IDPAY_SANDBOX: ${BOBRES_IDPAY_SANDBOX:-false}
      BOBRES_IDPAY_PROXY: ${BOBRES_IDPAY_PROXY:-}
      BOBRES_NEXTPAY_API_KEY: ${BOBRES_NEXTPAY_API_KEY:-}
      BOBRES_NEXTPAY_PROXY: ${BOBRES_NEXTPAY_PROXY:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [edge, backend, egress]

  provisioner:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-provisioner:${BOBRES_VERSION:-latest}${BOBRES_IMAGE_DIGEST_PROVISIONER:-}
    build: { <<: *build, args: { SERVICE: provisioner, VERSION: "${BOBRES_VERSION:-dev}" } }
    environment:
      <<: *common-env
      BOBRES_DATABASE_URL: postgres://svc_provisioner:${DB_PROVISIONER_PASSWORD}@postgres:5432/bobres?sslmode=disable
      # The token core presents to provisioner only.
      BOBRES_PEER_CORE_TOKEN: ${BOBRES_TOKEN_CORE_PROVISIONER:?set BOBRES_TOKEN_CORE_PROVISIONER}
      BOBRES_MASTER_KEY: ${BOBRES_PROVISIONER_MASTER_KEY:?set BOBRES_PROVISIONER_MASTER_KEY}
      # Optional first panel, registered only while no server exists; servers are
      # added and changed in the dashboard (Servers).
      BOBRES_XUI_URL: ${BOBRES_XUI_URL:-}
      BOBRES_XUI_TOKEN: ${BOBRES_XUI_TOKEN:-}
      BOBRES_XUI_SUB_URL: ${BOBRES_XUI_SUB_URL:-}
      BOBRES_XUI_ALLOW_PRIVATE: ${BOBRES_XUI_ALLOW_PRIVATE:-false}
    # A panel on this same server is reachable as http://host.docker.internal:<port>
    # (with BOBRES_XUI_ALLOW_PRIVATE=true; plain http then only to private addresses).
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend, egress]

  # Applies core's HTTPS requests to Caddy: the only writer of ./tls and the only service (besides Caddy)
  # with the admin socket. It has no network and no secret: core's request, which may carry the private
  # key of an own certificate, is a file in a volume only core and this service mount. It is given the
  # install's own names (core's values) and answers `invalid` to a request for any other: a compromised
  # core cannot make Caddy serve, or ask Let's Encrypt for, a name that is not the install's. Without
  # BOBRES_DOMAIN it refuses every request.
  tls-agent:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-core:${BOBRES_VERSION:-latest}${BOBRES_IMAGE_DIGEST_CORE:-}
    build: { <<: *build, args: { SERVICE: core, VERSION: "${BOBRES_VERSION:-dev}" } }
    profiles: [tls]
    command: ["tls-agent"]
    user: "65532:65532"
    network_mode: none
    environment:
      <<: *common-env
      BOBRES_DOMAIN: ${BOBRES_DOMAIN:?set BOBRES_DOMAIN}
      BOBRES_ZARINPAL_HOST: ${BOBRES_ZARINPAL_HOST:-}
    healthcheck:
      # The loop touches a heartbeat file in /tmp (a tmpfs) every round.
      test: ["CMD", "/app", "tls-agent", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 64m
    volumes:
      - tls_request:/request:ro
      - tls_result:/result
      - ./tls:/tls
      - ./caddy:/etc/bobres/caddy:ro
      - caddy_admin:/run/caddy

  backup:
    <<: *app
    image: ghcr.io/sobhanaz/bobres-backup:${BOBRES_VERSION:-latest}${BOBRES_IMAGE_DIGEST_BACKUP:-}
    build: { <<: *build, target: backup, args: { SERVICE: backup, VERSION: "${BOBRES_VERSION:-dev}" } }
    profiles: [backup]
    # The image is postgres:16-alpine (for pg_dump): a tmpfs over its data VOLUME keeps
    # Compose from creating an anonymous volume nothing uses.
    tmpfs: [/tmp, /var/lib/postgresql/data]
    environment:
      <<: *common-env
      # Optional values default to empty here even where the service needs them: Compose
      # reads every service, so an older .env without them must still work with the
      # profile off. The service refuses to start without its key or database.
      BOBRES_BACKUP_DATABASE_URL: postgres://svc_backup:${DB_BACKUP_PASSWORD:-}@postgres:5432/bobres?sslmode=disable
      BOBRES_BACKUP_KEY: ${BOBRES_BACKUP_KEY:-}
      BOBRES_BACKUP_TIME: ${BOBRES_BACKUP_TIME:-03:30}
      BOBRES_TIMEZONE: ${BOBRES_TIMEZONE:-Asia/Tehran}
      # Core lists and starts backups (System page) with the token it has for this service
      # only: never a token another service accepts from core.
      BOBRES_PEER_CORE_TOKEN: ${BOBRES_TOKEN_CORE_BACKUP:-}
      # Each backup goes to the bot, which sends it to the owner. Empty token = kept here only.
      BOBRES_BOT_URL: http://bot:8080
      BOBRES_SERVICE_TOKEN: ${BOBRES_TOKEN_BACKUP:-}
      # Carried inside each (encrypted) backup, so the file and BOBRES_BACKUP_KEY restore.
      BOBRES_CORE_MASTER_KEY: ${BOBRES_CORE_MASTER_KEY:-}
      BOBRES_PROVISIONER_MASTER_KEY: ${BOBRES_PROVISIONER_MASTER_KEY:-}
      BOBRES_PAYMENTS_MASTER_KEY: ${BOBRES_PAYMENTS_MASTER_KEY:-}
      # Optional: a copy of each (still encrypted) backup in S3-compatible storage, which
      # keeps the newest BOBRES_BACKUP_S3_KEEP. Empty endpoint = no copy. Settings that
      # cannot be used do not stop the service: each backup records why it was not copied.
      BOBRES_BACKUP_S3_ENDPOINT: ${BOBRES_BACKUP_S3_ENDPOINT:-}
      BOBRES_BACKUP_S3_BUCKET: ${BOBRES_BACKUP_S3_BUCKET:-}
      BOBRES_BACKUP_S3_REGION: ${BOBRES_BACKUP_S3_REGION:-}
      BOBRES_BACKUP_S3_PREFIX: ${BOBRES_BACKUP_S3_PREFIX:-}
      BOBRES_BACKUP_S3_ACCESS_KEY: ${BOBRES_BACKUP_S3_ACCESS_KEY:-}
      BOBRES_BACKUP_S3_SECRET_KEY: ${BOBRES_BACKUP_S3_SECRET_KEY:-}
      BOBRES_BACKUP_S3_KEEP: ${BOBRES_BACKUP_S3_KEEP:-30}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - backend
      # The internet only for the S3 copy: `bobres install` and `bobres config` set
      # BOBRES_BACKUP_NETWORK=egress with BOBRES_BACKUP_S3_ENDPOINT, and empty without it.
      - ${BOBRES_BACKUP_NETWORK:-offline}

networks:
  public: {}
  edge:
    internal: true
  backend:
    internal: true
  egress: {}
  offline:
    internal: true

volumes:
  pg_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
  # Caddy's admin socket: caddy and the tls-agent only.
  caddy_admin: {}
  # core -> tls-agent: the HTTPS request. tls-agent -> core: the answer.
  tls_request: {}
  tls_result: {}
