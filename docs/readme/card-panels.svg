<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="420" height="230" role="img" aria-label="Panels: 3x-ui, Marzban, S-UI, Hiddify; Several at once, weighted; Tested on real panels in CI">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .bob { animation: bob 4s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translate(340px, 66px) rotate(-6deg); } 50% { transform: translate(340px, 58px) rotate(-6deg); } }
  .blob { animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(-40px, 30px) scale(1.2); } }
  .edge { animation: run 7s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -700; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a33"/></linearGradient>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
  <linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  <radialGradient id="blobg"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <clipPath id="cl"><rect width="420" height="230" rx="24"/></clipPath>
</defs>
<g clip-path="url(#cl)">
  <rect width="420" height="230" fill="url(#bg)"/>
  <circle class="blob" cx="330" cy="40" r="150" fill="url(#blobg)"/>
  <rect y="0" width="420" height="6" fill="url(#g)"/>
</g>
<rect class="edge" x="1.5" y="1.5" width="417" height="227" rx="23" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="90 50" pathLength="700"/>
<text x="28" y="78" font-size="32" font-weight="900" fill="url(#g)">Panels</text>
<text x="28" y="124" font-size="16" fill="#e2e8f0"><tspan fill="#3b82f6" font-weight="900">›</tspan> 3x-ui, Marzban, S-UI, Hiddify</text><text x="28" y="152" font-size="16" fill="#e2e8f0"><tspan fill="#3b82f6" font-weight="900">›</tspan> Several at once, weighted</text><text x="28" y="180" font-size="16" fill="#e2e8f0"><tspan fill="#3b82f6" font-weight="900">›</tspan> Tested on real panels in CI</text>
<g class="bob" transform="translate(340 66) rotate(-6)"><g transform="translate(0 24)"><path d="M-36 -8 L0 -26 L36 -8 L0 10 Z" fill="url(#t)"/><path d="M-36 -8 L0 10 L0 22 L-36 4 Z" fill="url(#l)"/><path d="M36 -8 L0 10 L0 22 L36 4 Z" fill="url(#r)"/></g><g transform="translate(0 0)"><path d="M-36 -8 L0 -26 L36 -8 L0 10 Z" fill="url(#t)"/><path d="M-36 -8 L0 10 L0 22 L-36 4 Z" fill="url(#l)"/><path d="M36 -8 L0 10 L0 22 L36 4 Z" fill="url(#r)"/></g><g transform="translate(0 -24)"><path d="M-36 -8 L0 -26 L36 -8 L0 10 Z" fill="url(#t)"/><path d="M-36 -8 L0 10 L0 22 L-36 4 Z" fill="url(#l)"/><path d="M36 -8 L0 10 L0 22 L36 4 Z" fill="url(#r)"/></g></g>
