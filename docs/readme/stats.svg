<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 170" width="1280" height="170" role="img"
     aria-label="1 command, 4 panels, 10 ways to pay, 5 languages, about 400 purchases a second">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .card { animation: hover 4s ease-in-out infinite; }
  @keyframes hover { 50% { transform: translateY(-5px); } }
  .edge { animation: run 6s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -540; } }
  .num { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<g class="card" style="animation-delay:-0.0s">
  <defs>
    <linearGradient id="s0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  </defs>
  <rect x="16.0" y="18" width="236.8" height="134" rx="22" fill="#0b1220"/>
  <rect class="edge" x="16.0" y="18" width="236.8" height="134" rx="22" fill="none" stroke="url(#s0)" stroke-width="3" stroke-dasharray="60 30" pathLength="540"/>
  <rect x="34.0" y="34" width="200.8" height="6" rx="3" fill="url(#s0)" opacity=".9"/>
  <text class="num" x="134.4" y="98" font-size="44" font-weight="900" fill="url(#s0)" text-anchor="middle">1</text>
  <text x="134.4" y="124" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="middle">command</text>
  <text x="134.4" y="145" font-size="12.5" fill="#94a3b8" text-anchor="middle">install · update · repair</text>
</g>
<g class="card" style="animation-delay:-0.8s">
  <defs>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  </defs>
  <rect x="268.8" y="18" width="236.8" height="134" rx="22" fill="#0b1220"/>
  <rect class="edge" x="268.8" y="18" width="236.8" height="134" rx="22" fill="none" stroke="url(#s1)" stroke-width="3" stroke-dasharray="60 30" pathLength="540"/>
  <rect x="286.8" y="34" width="200.8" height="6" rx="3" fill="url(#s1)" opacity=".9"/>
  <text class="num" x="387.2" y="98" font-size="44" font-weight="900" fill="url(#s1)" text-anchor="middle">4</text>
  <text x="387.2" y="124" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="middle">panels</text>
  <text x="387.2" y="145" font-size="12.5" fill="#94a3b8" text-anchor="middle">3x-ui · Marzban · S-UI · Hiddify</text>
</g>
<g class="card" style="animation-delay:-1.6s">
  <defs>
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
  </defs>
  <rect x="521.6" y="18" width="236.8" height="134" rx="22" fill="#0b1220"/>
  <rect class="edge" x="521.6" y="18" width="236.8" height="134" rx="22" fill="none" stroke="url(#s2)" stroke-width="3" stroke-dasharray="60 30" pathLength="540"/>
  <rect x="539.6" y="34" width="200.8" height="6" rx="3" fill="url(#s2)" opacity=".9"/>
  <text class="num" x="640.0" y="98" font-size="44" font-weight="900" fill="url(#s2)" text-anchor="middle">10</text>
  <text x="640.0" y="124" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="middle">ways to pay</text>
  <text x="640.0" y="145" font-size="12.5" fill="#94a3b8" text-anchor="middle">cards · USDT · TON · Stars</text>
</g>
<g class="card" style="animation-delay:-2.4s">
  <defs>
    <linearGradient id="s3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  </defs>
  <rect x="774.4" y="18" width="236.8" height="134" rx="22" fill="#0b1220"/>
  <rect class="edge" x="774.4" y="18" width="236.8" height="134" rx="22" fill="none" stroke="url(#s3)" stroke-width="3" stroke-dasharray="60 30" pathLength="540"/>
  <rect x="792.4" y="34" width="200.8" height="6" rx="3" fill="url(#s3)" opacity=".9"/>
  <text class="num" x="892.8" y="98" font-size="44" font-weight="900" fill="url(#s3)" text-anchor="middle">5</text>
  <text x="892.8" y="124" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="middle">languages</text>
  <text x="892.8" y="145" font-size="12.5" fill="#94a3b8" text-anchor="middle">fa · en · ar · ru · tr</text>
</g>
<g class="card" style="animation-delay:-3.2s">
  <defs>
    <linearGradient id="s4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <rect x="1027.2" y="18" width="236.8" height="134" rx="22" fill="#0b1220"/>
  <rect class="edge" x="1027.2" y="18" width="236.8" height="134" rx="22" fill="none" stroke="url(#s4)" stroke-width="3" stroke-dasharray="60 30" pathLength="540"/>
  <rect x="1045.2" y="34" width="200.8" height="6" rx="3" fill="url(#s4)" opacity=".9"/>
  <text class="num" x="1145.6" y="98" font-size="44" font-weight="900" fill="url(#s4)" text-anchor="middle">~400</text>
  <text x="1145.6" y="124" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="middle">buys / second</text>
  <text x="1145.6" y="145" font-size="12.5" fill="#94a3b8" text-anchor="middle">on one machine</text>
</g>
</svg>
