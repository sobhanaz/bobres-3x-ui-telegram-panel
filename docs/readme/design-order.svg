<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 450" width="1280" height="450" role="img" aria-label="Order Flow: Money is whole numbers in minor units, never floats; the ledger is append-only and every money call carries an idempotency key. Events go through an outbox and an inbox.">
<style>.sans { font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; } .mono { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; } .fa { font-family: Vazirmatn, Tahoma, 'Geeza Pro', 'Noto Naskh Arabic', 'Segoe UI', sans-serif; }
.run { animation: run 9s linear infinite; } @keyframes run { to { stroke-dashoffset: -1000; } } .live { animation: live 1.6s ease-in-out infinite; } @keyframes live { 50% { opacity: .25; } } .flowdot { animation: drop 1.6s ease-in infinite; } @keyframes drop { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(6px); opacity: .2; } } .step { animation: glowstep 4.8s ease-in-out infinite; } @keyframes glowstep { 50% { opacity: .78; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
