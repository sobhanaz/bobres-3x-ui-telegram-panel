<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="420" height="230" role="img" aria-label="Customers: Bot and Mini App store; Wallet, trial, renewals; Codes, invites, support">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .bob { animation: bob 4s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translate(340px, 66px) rotate(-6deg); } 50% { transform: translate(340px, 58px) rotate(-6deg); } }
  .blob { animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(-40px, 30px) scale(1.2); } }
  .edge { animation: run 7s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -700; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a33"/></linearGradient>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  <radialGradient id="blobg"><stop offset="0" stop-color="#0ea5e9" stop-opacity=".45"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
  <clipPath id="cl"><rect width="420" height="230" rx="24"/></clipPath>
</defs>
<g clip-path="url(#cl)">
  <rect width="420" height="230" fill="url(#bg)"/>
  <circle class="blob" cx="330" cy="40" r="150" fill="url(#blobg)"/>
  <rect y="0" width="420" height="6" fill="url(#g)"/>
</g>
<rect class="edge" x="1.5" y="1.5" width="417" height="227" rx="23" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="90 50" pathLength="700"/>
<text x="28" y="78" font-size="32" font-weight="900" fill="url(#g)">Customers</text>
<text x="28" y="124" font-size="16" fill="#e2e8f0"><tspan fill="#14b8a6" font-weight="900">›</tspan> Bot and Mini App store</text><text x="28" y="152" font-size="16" fill="#e2e8f0"><tspan fill="#14b8a6" font-weight="900">›</tspan> Wallet, trial, renewals</text><text x="28" y="180" font-size="16" fill="#e2e8f0"><tspan fill="#14b8a6" font-weight="900">›</tspan> Codes, invites, support</text>
<g class="bob" transform="translate(340 66) rotate(-6)"><path d="M-34 -6 L0 -24 L34 -6 L0 12 Z" fill="url(#t)"/><path d="M-34 -6 L0 12 L0 40 L-34 22 Z" fill="url(#l)"/><path d="M34 -6 L0 12 L0 40 L34 22 Z" fill="url(#r)"/><circle cx="-14" cy="48" r="6" fill="#f8fafc"/><circle cx="16" cy="48" r="6" fill="#f8fafc"/></g>
</svg>
