syntax = "proto3";

package provisioner.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/sobhanaz/bobres-3x-ui-telegram-panel/gen/proto/provisioner/v1;provisionerv1";

message Client {
  string subscription_id = 1;
  string server_id = 2;
  string email = 3;
  string xui_sub_id = 4;
  repeated int32 inbound_ids = 5;
  int64 expires_at = 6;
  int64 traffic_total_bytes = 7;
}

message Usage {
  string subscription_id = 1;
  int64 traffic_used_bytes = 2;
  int64 last_synced_at = 3;
  // The panel's current limits: what the customer really has.
  int64 traffic_total_bytes = 4; // 0 = unlimited
  int64 expires_at = 5; // unix seconds; 0 = no expiry; negative = starts on first use (set in the panel)
  bool enabled = 6;
}

message Links {
  // The subscription URL (sub_base_url + subId) when the server has a
  // subscription base URL configured, otherwise the first config link.
  string subscription_link = 1;
  string qr_png_base64 = 2; // PNG QR code of subscription_link
  repeated string config_links = 3; // one share link per attached inbound
}

message Inbound {
  int32 id = 1;
  string tag = 2;
  bool enabled = 3; // the panel's own enable flag
  // New clients are attached to it (when the panel also enables it). Set
  // with SetInboundAttach; existing clients keep their inbounds.
  bool attach = 4;
  string protocol = 5;
  int32 port = 6;
}

// XUIServer is a registered 3x-ui panel. The API token is never part of it.
message XUIServer {
  string id = 1;
  string name = 2;
  string base_url = 3;
  // From the last successful check: "v3.9.0", or "v3.x" when the panel did
  // not say.
  string panel_version = 4;
  bool enabled = 5;
  string sub_base_url = 6;
  bool allow_private = 7;
  // Share of new clients: the server with the least clients/weight is picked.
  int32 weight = 8;
  // "env" (seeded from the installer's environment) or "dashboard".
  string managed = 9;
  bool has_token = 10;
  // Clients mapped to this server, deliveries in progress included.
  int64 clients = 11;
  // The last health check; checked_at is 0 (and healthy meaningless) until
  // the first one.
  bool healthy = 12;
  string health_error = 13;
  int64 checked_at = 14; // unix seconds
  // panel_version is outside the tested range (ListServersResponse).
  bool version_untested = 15;
  // "xui" (3x-ui) or "marzban"; empty reads as "xui".
  string kind = 16;
  // The most clients the server takes; 0 is no limit. A server whose clients
  // (reservations included) have reached it is skipped for new clients and
  // refuses an explicit request for one; the clients it has keep working.
  int32 max_clients = 17;
}

message CreateClientRequest {
  string subscription_id = 1;
  // An explicit server; a disabled one is refused. Wins over
  // candidate_server_ids.
  string server_id = 2;
  string email = 3;
  int64 duration_days = 4;
  int64 traffic_bytes = 5;
  // The servers the subscription may go to (a plan's servers); empty = every
  // enabled server. The healthy, enabled one with the least clients/weight is
  // picked, and a retry stays on it.
  repeated string candidate_server_ids = 6;
  // The inbounds a plan chose, per server. When the picked server has an entry,
  // the client is attached to exactly those inbounds that are enabled in the
  // panel (whether or not they are detached with SetInboundAttach: an explicit
  // choice wins over that default); none of them being enabled there is a
  // FailedPrecondition. A server without an entry gets every enabled, attached
  // inbound, as before. Only a fresh reservation reads it: a retry attaches
  // the same way again.
  repeated InboundSelection inbounds = 7;
  // The 3x-ui client group the client is put in ("" is the default group,
  // "BOBRES"; a reseller's clients are in "BOBRES-<NAME>"). Marzban has no
  // groups and ignores it. An older provisioner ignores the field too.
  string group = 8;
}

// SetClientGroupsRequest records the group each client should be in; a 3x-ui
// panel is then brought in line in the background, moving only the clients that
// are in a group BOBRES owns (none, "BOBRES", "bobres_bot" or "BOBRES-<NAME>"),
// never one an operator chose.
message SetClientGroupsRequest {
  repeated ClientGroup clients = 1; // at most 500 a call
}

message ClientGroup {
  string subscription_id = 1;
  string group = 2; // "" is the default group
}

message SetClientGroupsResponse {
  int32 updated = 1; // the subscriptions the provisioner holds; the others are skipped
}

// InboundSelection names the panel inbounds (their ids in that panel) a
// client of one server is attached to.
message InboundSelection {
  string server_id = 1;
  repeated int32 inbound_ids = 2;
}

message RenewClientRequest {
  string subscription_id = 1;
  int64 add_days = 2;
  int64 add_bytes = 3;
}

// SetClientLimitsRequest sets absolute limits (so a retry is harmless) and
// enables the client: renewals and traffic top-ups.
message SetClientLimitsRequest {
  string subscription_id = 1;
  int64 expires_at = 2; // unix seconds, 0 = no expiry
  int64 traffic_total_bytes = 3; // 0 = unlimited
}

// SetClientEnabledRequest turns a client off (it cannot connect) or back on;
// its limits stay.
message SetClientEnabledRequest {
  string subscription_id = 1;
  bool enabled = 2;
}

message DeleteClientRequest {
  string subscription_id = 1;
}

message ResetTrafficRequest {
  string subscription_id = 1;
}

message GetUsageRequest {
  string subscription_id = 1;
}

message GetLinksRequest {
  string subscription_id = 1;
}

message ListInboundsRequest {
  string server_id = 1;
}

message ListInboundsResponse {
  repeated Inbound inbounds = 1;
}

message AddServerRequest {
  string name = 1;
  string base_url = 2;
  string api_token = 3; // encrypted at rest once stored; plaintext only in transit
  // Public prefix of the panel's subscription server, e.g.
  // https://sub.example.com:2096/sub/ (optional).
  string sub_base_url = 4;
  // The panel is on a private/loopback address (same host or LAN). Off by
  // default: the client refuses such addresses to block SSRF.
  bool allow_private = 5;
  int32 weight = 6; // 1..1000; 0 = 100
  // Save without testing the connection first (the panel is down for now).
  bool skip_check = 7;
  // Whether the server takes new clients from the start. Unset means on, as
  // for callers from before it existed; false saves it switched off, so it
  // is never briefly on.
  optional bool enabled = 8;
  // "xui" (default) or "marzban". Fixed once the server is added. For
  // "marzban", api_token is "username:password" of a Marzban admin.
  string kind = 9;
  // 0..1000000; 0 = no limit (XUIServer.max_clients).
  int32 max_clients = 10;
}

message ListServersRequest {}

message ListServersResponse {
  repeated XUIServer servers = 1;
  // The panel versions BOBRES is tested against (both inclusive).
  string tested_min_version = 2;
  string tested_max_version = 3;
}

// UpdateServerRequest replaces a server's settings. The connection is tested
// first when it changes (URL, token or allow_private) unless skip_check.
message UpdateServerRequest {
  string id = 1;
  string name = 2;
  bool enabled = 3; // a disabled server gets no new clients; existing ones keep working
  int32 weight = 4; // 1..1000
  string sub_base_url = 5;
  bool allow_private = 6;
  string base_url = 7;
  // Empty = keep the stored token. A new address (host or port) needs the
  // token again, so the stored one is never sent to a host it was not
  // entered for.
  string api_token = 8;
  bool skip_check = 9;
  // 0..1000000; 0 = no limit. Unset keeps the stored limit (a caller from
  // before the limit existed would otherwise lift it).
  optional int32 max_clients = 10;
}

message DeleteServerRequest {
  string id = 1;
}

// TestServerRequest names the connection to try: an existing server (id)
// with its stored settings, or candidate settings. With an id, a base_url
// tries a new address (allow_private from this request) and an api_token a
// new token; the rules of UpdateServerRequest.api_token apply.
message TestServerRequest {
  string id = 1;
  string base_url = 2;
  string api_token = 3;
  bool allow_private = 4;
  // For candidate settings (no id): "xui" (default) or "marzban". With an id
  // the server's own kind is used.
  string kind = 5;
}

message TestServerResponse {
  bool ok = 1;
  string panel_version = 2;
  int32 inbounds = 3;
  string detail = 4; // why it failed
}

message SetInboundAttachRequest {
  string server_id = 1;
  int32 inbound_id = 2;
  bool attach = 3;
}

message HealthCheckRequest {
  string server_id = 1;
}

message HealthCheckResponse {
  bool healthy = 1;
  string panel_version = 2;
  string detail = 3;
}

// RecentLogsRequest asks for the service's kept warnings and errors (core's
// System page, owner only).
message RecentLogsRequest {}

// LogLine is one kept log line, redacted like the service's stdout.
message LogLine {
  int64 time = 1; // unix seconds
  string level = 2; // WARN | ERROR
  string msg = 3;
  string attrs = 4; // the other fields as a JSON object; a long one is cut and ends with "…"
}

message RecentLogsResponse {
  repeated LogLine lines = 1; // the newest 500 since the service started, oldest first
}

// ProvisionerService is the only service that holds 3x-ui API tokens and
// talks to 3x-ui panels directly.
service ProvisionerService {
  rpc CreateClient(CreateClientRequest) returns (Client);
  rpc RenewClient(RenewClientRequest) returns (Client);
  rpc SetClientLimits(SetClientLimitsRequest) returns (Client);
  rpc SetClientEnabled(SetClientEnabledRequest) returns (Client);
  rpc DeleteClient(DeleteClientRequest) returns (google.protobuf.Empty);
  rpc ResetTraffic(ResetTrafficRequest) returns (Client);
  rpc GetUsage(GetUsageRequest) returns (Usage);
  rpc GetLinks(GetLinksRequest) returns (Links);
  rpc ListInbounds(ListInboundsRequest) returns (ListInboundsResponse);
  rpc SetInboundAttach(SetInboundAttachRequest) returns (google.protobuf.Empty);
  // SetClientGroups changes the 3x-ui group clients should be in (a reseller's
  // existing clients move to the reseller's group); see SetClientGroupsRequest.
  rpc SetClientGroups(SetClientGroupsRequest) returns (SetClientGroupsResponse);
  rpc AddServer(AddServerRequest) returns (XUIServer);
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  rpc UpdateServer(UpdateServerRequest) returns (XUIServer);
  // DeleteServer refuses (FailedPrecondition) while clients are mapped to it.
  rpc DeleteServer(DeleteServerRequest) returns (google.protobuf.Empty);
  // TestServer connects and lists inbounds; it saves nothing.
  rpc TestServer(TestServerRequest) returns (TestServerResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  // The service's kept warnings and errors, for the System page.
  rpc RecentLogs(RecentLogsRequest) returns (RecentLogsResponse);
}
