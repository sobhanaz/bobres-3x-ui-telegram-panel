syntax = "proto3";

package core.v1;

import "common/v1/types.proto";

option go_package = "github.com/sobhanaz/bobres-3x-ui-telegram-panel/gen/proto/core/v1;corev1";

// --- Domain messages ---

message User {
  string id = 1; // uuid
  int64 telegram_id = 2;
  string username = 3;
  string language = 4; // fa | en
  string role = 5; // user | support | admin | owner | reseller
  string status = 6; // active | banned
  string referred_by = 7; // uuid, optional
  int64 created_at = 8; // unix seconds
  int64 updated_at = 9;
}

message Plan {
  string id = 1; // uuid
  map<string, string> name_i18n = 2; // lang -> name
  string kind = 3; // traffic | time | both
  int32 duration_days = 4;
  int64 traffic_bytes = 5;
  common.v1.Money price = 6;
  bool enabled = 7;
  bool is_trial = 8;
  int32 sort = 9;
}

message Order {
  string id = 1; // uuid
  string user_id = 2;
  string plan_id = 3;
  string type = 4; // new | renew | traffic_topup
  string status = 5; // created|awaiting_payment|paid|provisioning|active|provision_failed|cancelled|expired
  common.v1.Money amount = 6;
  string idempotency_key = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message Wallet {
  string user_id = 1;
  string currency = 2;
  int64 balance = 3;
  int64 updated_at = 4;
}

message LedgerEntry {
  string id = 1;
  string user_id = 2;
  string currency = 3;
  int64 amount = 4;
  string kind = 5; // topup | purchase | refund | adjust | trial_grant
  string ref_type = 6;
  string ref_id = 7;
  string idempotency_key = 8;
  int64 balance_after = 9;
  int64 created_at = 10;
}

message Subscription {
  string id = 1;
  string user_id = 2;
  string order_id = 3;
  string server_id = 4;
  string client_email = 5;
  string sub_id = 6;
  string status = 7; // pending|active|expiring_soon|expired|disabled|depleted
  int64 expires_at = 8;
  int64 traffic_total_bytes = 9;
  int64 traffic_used_bytes = 10;
  int64 last_synced_at = 11;
  string subscription_link = 12; // set once provisioned
}

message Ticket {
  string id = 1;
  string user_id = 2;
  string category = 3;
  string text = 4;
  string status = 5; // open | closed
  int64 created_at = 6;
}

message Settings {
  map<string, string> values = 1; // flattened key -> JSON-encoded value
}

// --- Request/response messages ---

message UpsertUserRequest {
  int64 telegram_id = 1;
  string username = 2;
  string language = 3;
  string referred_by = 4;
}

message GetUserRequest {
  oneof lookup {
    string id = 1;
    int64 telegram_id = 2;
  }
}

message ListPlansRequest {
  bool include_disabled = 1;
}

message ListPlansResponse {
  repeated Plan plans = 1;
}

message CreateOrderRequest {
  string user_id = 1;
  string plan_id = 2;
  string type = 3;
  string idempotency_key = 4;
}

message GetOrderRequest {
  string id = 1;
}

message GetWalletRequest {
  string user_id = 1;
  string currency = 2;
}

message ListLedgerEntriesRequest {
  string user_id = 1;
  common.v1.Pagination pagination = 2;
}

message ListLedgerEntriesResponse {
  repeated LedgerEntry entries = 1;
  common.v1.PageInfo page_info = 2;
}

message ListSubscriptionsRequest {
  string user_id = 1;
  common.v1.Pagination pagination = 2;
}

message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
  common.v1.PageInfo page_info = 2;
}

message CreateSupportTicketRequest {
  string user_id = 1;
  string category = 2;
  string text = 3;
}

message GetSettingsRequest {}

message UpdateBrandingRequest {
  map<string, string> values = 1;
  string actor_id = 2;
  string reason = 3;
}

message ReviewManualPaymentRequest {
  string intent_id = 1;
  string reviewer_id = 2; // ignored: the reviewer is resolved from actor_telegram_id
  string decision = 3; // approved | rejected
  string reason = 4;
  int64 actor_telegram_id = 5; // must belong to an admin or the owner
}

message PaymentIntentRef {
  string id = 1;
  string status = 2;
  string order_id = 3;
  string provider = 4;
  string instructions = 5; // rendered payment instructions for the user
  common.v1.Money amount = 6;
  // Structured details so the bot can render instructions in the user's
  // language: card_number, card_holder, usdt_trc20, usdt_erc20, reference.
  map<string, string> details = 7;
  // Automated gateways: where to pay (Zarinpal, Crypto Pay), what is charged
  // there (XTR for a Stars invoice), and the invoice title.
  string pay_url = 8;
  common.v1.Money gateway_amount = 9;
  string description = 10;
  string failure_reason = 11;
}

message CheckPaymentRequest {
  string user_id = 1; // must own the intent
  string intent_id = 2;
}

// StarsPreCheckoutRequest relays a Telegram Stars pre_checkout_query.
message StarsPreCheckoutRequest {
  string user_id = 1;
  string intent_id = 2; // the invoice payload
  int64 total_amount = 3;
  string currency = 4;
}

// StarsPaidRequest relays a Telegram Stars successful_payment.
message StarsPaidRequest {
  string user_id = 1;
  string intent_id = 2; // the invoice payload
  int64 total_amount = 3;
  string currency = 4;
  string telegram_payment_charge_id = 5;
}

message ListPaymentMethodsRequest {
  string currency = 1; // the plan's currency, e.g. IRT
}

message ListPaymentMethodsResponse {
  repeated string providers = 1; // automated methods usable now, e.g. zarinpal, stars, cryptopay
}

message SubmitPaymentProofRequest {
  string user_id = 1;
  string intent_id = 2;
  // Card payments: receipt photo (Telegram file_id) and bank reference number.
  string receipt_file = 3;
  string reference_number = 4;
  // Crypto payments: network and transaction id.
  string network = 5;
  string txid = 6;
}

message GetSubscriptionLinksRequest {
  string user_id = 1; // must own the subscription
  string subscription_id = 2;
}

message SubscriptionLinks {
  string subscription_link = 1;
  bytes qr_png = 2;
  repeated string config_links = 3;
}

// --- Admin RPCs: actor_telegram_id must belong to an active admin or owner.
// Every change is written to the audit log with the actor and the reason.

message AdminGetStatsRequest {
  int64 actor_telegram_id = 1;
}

message AdminStats {
  int64 users_total = 1;
  int64 users_today = 2;
  int64 active_subscriptions = 3;
  int64 pending_payments = 4;
  int64 provision_failed_orders = 5;
  bool panel_healthy = 6;
  string panel_detail = 7;
}

message AdminListPendingPaymentsRequest {
  int64 actor_telegram_id = 1;
  int32 limit = 2;
}

message PendingPayment {
  string intent_id = 1;
  string order_id = 2;
  User user = 3;
  string provider = 4;
  common.v1.Money amount = 5;
  string receipt_file = 6;
  string reference_number = 7;
  string network = 8;
  string txid = 9;
  int64 submitted_at = 10;
  bool possible_duplicate = 11;
}

message AdminListPendingPaymentsResponse {
  repeated PendingPayment payments = 1;
}

message AdminFindUserRequest {
  int64 actor_telegram_id = 1;
  string query = 2; // Telegram id or @username
}

message AdminUserView {
  User user = 1;
  repeated Wallet wallets = 2;
  int64 subscriptions = 3;
  int64 orders = 4;
}

message AdminAdjustBalanceRequest {
  int64 actor_telegram_id = 1;
  string user_id = 2;
  common.v1.Money delta = 3; // signed; the balance can never go below zero
  string reason = 4;
  string idempotency_key = 5;
}

message AdminSetUserStatusRequest {
  int64 actor_telegram_id = 1;
  string user_id = 2;
  string status = 3; // active | banned
  string reason = 4;
}

message AdminUpsertPlanRequest {
  int64 actor_telegram_id = 1;
  Plan plan = 2; // empty id creates a plan
}

message AdminSetSettingRequest {
  int64 actor_telegram_id = 1;
  string key = 2; // one of the documented setting keys
  string value = 3; // plain text
}

message PayOrderWithWalletRequest {
  string order_id = 1;
  // Kept for compatibility; the order id is the idempotency anchor (one order
  // can only ever be charged once).
  string idempotency_key = 2;
  string user_id = 3; // when set, must own the order
}

message CreatePaymentIntentRequest {
  string user_id = 1;
  string order_id = 2;        // empty for wallet top-up intents
  string provider = 3;        // manual_card | manual_crypto | zarinpal | stars | cryptopay
  common.v1.Money amount = 4; // required when order_id is empty
  string idempotency_key = 5;
}

message StartTrialRequest {
  string user_id = 1;
  string plan_id = 2;
  string idempotency_key = 3;
}

// CoreService owns users, plans, orders, wallet ledger, subscriptions,
// audit log, branding/settings, and the dashboard API backing store.
service CoreService {
  rpc UpsertUser(UpsertUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc GetWallet(GetWalletRequest) returns (Wallet);
  rpc ListLedgerEntries(ListLedgerEntriesRequest) returns (ListLedgerEntriesResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc CreateSupportTicket(CreateSupportTicketRequest) returns (Ticket);
  rpc GetSettings(GetSettingsRequest) returns (Settings);
  rpc UpdateBranding(UpdateBrandingRequest) returns (Settings);
  rpc ReviewManualPayment(ReviewManualPaymentRequest) returns (PaymentIntentRef);
  rpc PayOrderWithWallet(PayOrderWithWalletRequest) returns (Order);
  rpc CreatePaymentIntent(CreatePaymentIntentRequest) returns (PaymentIntentRef);
  rpc StartTrial(StartTrialRequest) returns (Order);
  rpc CanStartTrial(CanStartTrialRequest) returns (CanStartTrialResponse);
  rpc SubmitPaymentProof(SubmitPaymentProofRequest) returns (PaymentIntentRef);
  rpc CheckPayment(CheckPaymentRequest) returns (PaymentIntentRef);
  rpc StarsPreCheckout(StarsPreCheckoutRequest) returns (PaymentIntentRef);
  rpc StarsPaid(StarsPaidRequest) returns (PaymentIntentRef);
  rpc ListPaymentMethods(ListPaymentMethodsRequest) returns (ListPaymentMethodsResponse);
  rpc GetSubscriptionLinks(GetSubscriptionLinksRequest) returns (SubscriptionLinks);
  rpc AdminGetStats(AdminGetStatsRequest) returns (AdminStats);
  rpc AdminListPendingPayments(AdminListPendingPaymentsRequest) returns (AdminListPendingPaymentsResponse);
  rpc AdminFindUser(AdminFindUserRequest) returns (AdminUserView);
  rpc AdminAdjustBalance(AdminAdjustBalanceRequest) returns (Wallet);
  rpc AdminSetUserStatus(AdminSetUserStatusRequest) returns (User);
  rpc AdminUpsertPlan(AdminUpsertPlanRequest) returns (Plan);
  rpc AdminSetSetting(AdminSetSettingRequest) returns (Settings);
}

message CanStartTrialRequest {
  string user_id = 1;
}

message CanStartTrialResponse {
  bool eligible = 1;
}
