syntax = "proto3";

package core.v1;

import "common/v1/types.proto";
import "core/v1/help.proto";

option go_package = "github.com/sobhanaz/bobres-3x-ui-telegram-panel/gen/proto/core/v1;corev1";

// --- Domain messages ---

message User {
  string id = 1; // uuid
  int64 telegram_id = 2;
  string username = 3;
  string language = 4; // fa | en
  string role = 5; // user | support | admin | owner | reseller
  string status = 6; // active | banned
  string referred_by = 7; // uuid, optional
  int64 created_at = 8; // unix seconds
  int64 updated_at = 9;
  bool bot_blocked = 10; // Telegram said the user blocked the bot
}

message Plan {
  string id = 1; // uuid
  map<string, string> name_i18n = 2; // lang -> name
  string kind = 3; // traffic | time | both
  int32 duration_days = 4;
  int64 traffic_bytes = 5;
  common.v1.Money price = 6;
  bool enabled = 7;
  bool is_trial = 8;
  int32 sort = 9;
  bool is_topup = 10; // a traffic package for an existing subscription
  // The store price. price is what the user ListPlans was asked for pays (a
  // reseller's tier price); without a user both are the store price.
  common.v1.Money list_price = 11;
  // The inbounds the plan attaches new services to, per 3x-ui server (a server
  // without an entry: every inbound the provisioner attaches by default).
  // AdminUpsertPlan keeps the stored selection when this is empty, like the
  // servers of a plan (which this message does not carry); the dashboard's
  // plan editor is where a selection is cleared.
  repeated InboundSelection inbounds = 12;
  // The plan group it is listed under (empty: none). AdminUpsertPlan keeps the
  // stored group when this is empty: the bot's plan editor never changes it,
  // the dashboard is where plans are grouped.
  string group_id = 13;
  // The percent of the discount code a paid purchase of this plan gives its buyer for their next purchase of it (0: none).
  // AdminUpsertPlan keeps the stored value when this is 0: the bot's plan editor never changes it, the dashboard does.
  int32 reward_percent = 14;
}

// PlanGroup is a named group of plans with a text the customer reads before
// choosing one of them. A plan with no group is listed under "other plans".
message PlanGroup {
  string id = 1; // uuid
  map<string, string> name_i18n = 2; // lang -> name
  map<string, string> description_i18n = 3; // lang -> text
  int32 sort = 4;
}

// InboundSelection names the inbounds (their ids in that panel) of one 3x-ui
// server.
message InboundSelection {
  string server_id = 1;
  repeated int32 inbound_ids = 2;
}

message Order {
  string id = 1; // uuid
  string user_id = 2;
  string plan_id = 3;
  string type = 4; // new | renew | traffic_topup
  string status = 5; // created|awaiting_payment|paid|provisioning|active|provision_failed|cancelled|expired
  common.v1.Money amount = 6;
  string idempotency_key = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  string subscription_id = 10; // renew | traffic_topup: the subscription extended
  string discount_code = 11;
  common.v1.Money discount = 12; // already taken off amount
  string label = 13; // a reseller's name for the service it creates
}

message Wallet {
  string user_id = 1;
  string currency = 2;
  int64 balance = 3; // a reseller's may be negative: what they owe
  int64 updated_at = 4;
  int64 credit_limit = 5; // resellers: the balance may go down to -credit_limit (0 for everyone else)
}

message LedgerEntry {
  string id = 1;
  string user_id = 2;
  string currency = 3;
  int64 amount = 4;
  string kind = 5; // topup | purchase | refund | adjust | trial_grant | referral | commission | settlement | gift_code
  string ref_type = 6;
  string ref_id = 7;
  string idempotency_key = 8;
  int64 balance_after = 9;
  int64 created_at = 10;
}

message Subscription {
  string id = 1;
  string user_id = 2;
  string order_id = 3;
  string server_id = 4;
  string client_email = 5;
  string sub_id = 6;
  string status = 7; // pending|active|expiring_soon|expired|disabled|depleted
  int64 expires_at = 8;
  int64 traffic_total_bytes = 9;
  int64 traffic_used_bytes = 10;
  int64 last_synced_at = 11;
  string subscription_link = 12; // set once provisioned
  string label = 13; // the name a reseller gave it ("" = none)
  // The branded page for this service (public base URL + /sub/<token>); "" when
  // the page is switched off or the public URL is not set.
  string page_url = 14;
  // A reseller's private note about the service (one line, at most 200
  // characters; "" = none). Only the reseller's own screens show it.
  string note = 15;
}

message FindServiceByLinkRequest {
  string user_id = 1;
  string link = 2; // a subscription link, the branded page's address, or the end of one
}

message FoundService {
  Subscription service = 1; // for another person's service: no owner, order, server, e-mail, name or note
  bool mine = 2; // the service is the caller's own
  string secret = 3; // what a renewal of it carries (CreateOrderRequest.link_secret)
}

message Ticket {
  string id = 1;
  string user_id = 2;
  string category = 3; // payment | service | other (general on old tickets)
  string text = 4; // the subject: the first line of the first message
  string status = 5; // open (waiting for staff) | answered | closed
  int64 created_at = 6;
  int64 number = 7; // what customers and staff call it (#1024)
  int64 updated_at = 8;
  string last_from = 9; // customer | staff: who wrote last
}

// TicketMessage is one message of a ticket as the customer sees it (staff
// notes are never sent to the bot).
message TicketMessage {
  string id = 1;
  string kind = 2; // customer | staff
  string body = 3;
  bool has_file = 4;
  int64 created_at = 5;
}

message AddTicketMessageRequest {
  string user_id = 1;
  string category = 2; // for a new ticket: payment | service | other
  string ticket_id = 3; // optional: the ticket the customer answers (a button)
  int64 reply_to_tg_message_id = 4; // optional: the delivered staff reply the customer answered
  string text = 5;
  string file_id = 6; // Telegram file id of a photo, image or PDF
  string file_type = 7; // photo | document
  string file_mime = 8;
  string file_name = 9;
  int64 file_size = 10;
  int64 tg_message_id = 11; // the customer's message: makes a repeat harmless
  // With reply_to_tg_message_id: only says whether it is this customer's
  // delivered staff reply (NOT_FOUND otherwise); nothing is saved.
  bool check_only = 12;
}

message AddTicketMessageResponse {
  Ticket ticket = 1;
  string message_id = 2;
  bool created = 3; // false: this Telegram message was recorded already
  bool new_ticket = 4;
  int64 closed_number = 5; // the closed ticket the customer answered (a new one was started)
}

message GetMyTicketsRequest {
  string user_id = 1;
  int32 limit = 2; // recent tickets, at most 10
}

message MyTickets {
  Ticket open = 1; // the ticket that is not closed, if any
  repeated Ticket recent = 2;
}

message GetMyTicketRequest {
  string user_id = 1;
  string ticket_id = 2;
  int32 last = 3; // the last N messages (default 3, at most 20)
}

message TicketThread {
  Ticket ticket = 1;
  repeated TicketMessage messages = 2; // oldest first
}

message CloseMyTicketRequest {
  string user_id = 1;
  string ticket_id = 2;
}

message GetTicketMessageRequest {
  string message_id = 1;
}

// TicketMessageView is what the notifier needs to deliver a reply or alert
// staff about a customer's message.
message TicketMessageView {
  string ticket_id = 1;
  int64 ticket_number = 2;
  int64 telegram_id = 3; // the customer
  string language = 4; // the customer's
  string username = 5; // the customer's
  string kind = 6; // customer | staff | note
  string body = 7;
  bool has_file = 8;
  string delivery = 9; // staff replies: pending | sent | blocked | failed
  bool closed = 10; // the ticket is closed
  string category = 11;
  string url = 12; // the ticket in the dashboard ("" without a public https address)
  string file_id = 13;
  string file_type = 14;
}

message ReportTicketDeliveryRequest {
  string message_id = 1;
  string status = 2; // sent | blocked | failed
  int64 tg_message_id = 3; // the delivered copy (sent)
}

message ReportTicketDeliveryResponse {}

message SetUserBotBlockedRequest {
  int64 telegram_id = 1;
  bool blocked = 2;
}

message SetUserBotBlockedResponse {}

message ClaimBroadcastBatchRequest {
  int32 limit = 1; // at most 100
}

message BroadcastRecipient {
  string user_id = 1;
  int64 telegram_id = 2;
  string language = 3;
}

message BroadcastBatch {
  string broadcast_id = 1; // empty: nothing to send now
  map<string, string> texts = 2; // language -> HTML text
  string button_url = 3; // empty: no button
  map<string, string> button_labels = 4;
  repeated BroadcastRecipient recipients = 5;
}

enum BroadcastOutcome {
  BROADCAST_OUTCOME_UNSPECIFIED = 0;
  BROADCAST_OUTCOME_SENT = 1;
  BROADCAST_OUTCOME_BLOCKED = 2; // the user blocked the bot (or deleted their account)
  BROADCAST_OUTCOME_FAILED = 3; // Telegram refused this message
  BROADCAST_OUTCOME_UNKNOWN = 4; // sent, but no answer: never retried
  BROADCAST_OUTCOME_RELEASED = 5; // not attempted (pause, cancel, shutdown): back in line
}

message BroadcastResult {
  string user_id = 1;
  BroadcastOutcome outcome = 2;
  int64 message_id = 3;
  string error = 4;
}

message ReportBroadcastResultsRequest {
  string broadcast_id = 1;
  repeated BroadcastResult results = 2;
  string halt_reason = 3; // non-empty: pause the broadcast and say why
}

message BroadcastState {
  string status = 1; // running | paused | cancelled | done
}

message Settings {
  map<string, string> values = 1; // flattened key -> JSON-encoded value
  // The bot photo's version: when it was uploaded, in unix nanoseconds; ""
  // when the store has none, "?" when core could not read it (the bot then
  // leaves its photo as it is). An older core never sets it.
  string bot_photo_version = 2;
  // True when the license includes white label: the bot then leaves the
  // vendor credit out of its about text. False when it is not, and for an
  // older core that never sets it, so a missing answer shows the credit.
  bool white_label = 3;
  // Where the Telegram Mini App store is opened from, https://<domain>/app/,
  // when it is on and the store has a public HTTPS address Telegram can reach;
  // "" otherwise (and for an older core). The bot then puts a Store button in
  // its menu and sets Telegram's menu button to it.
  string miniapp_url = 4;
  // True when the license in effect (a license, its grace period or the trial;
  // not the free tier) includes resellers: the bot then offers customers the
  // "Become a reseller" button. False when it does not, and for an older core
  // that never sets it, so a missing answer hides the button.
  bool resellers_enabled = 5;
  // Whether the help screens have anything to show: at least one enabled FAQ
  // question and at least one enabled tutorial that a customer can read in some
  // language. The bot shows its FAQ button (under Support) and its Tutorials
  // button only while these are true. Both are false for an older core, which
  // never sets them.
  bool help_faq = 6;
  bool help_tutorials = 7;
  // The extra channels and groups customers must join, after the first one (the
  // settings join.channel, join.link and join.label, in values), in the order
  // customers are asked, limited to what the license in effect allows
  // (max_join_chats): the chats the bot is to enforce, not the ones merely
  // saved. Empty while the first one is not set, and for an older core, which
  // never sets it: the bot then holds customers to the first chat only.
  repeated JoinChat join_chats = 8;
}

// A required channel or group.
message JoinChat {
  string chat = 1;  // a public chat's @name, or a private chat's -100… id
  string link = 2;  // the https://t.me/… link of the Join button; "" = the chat's t.me page
  string label = 3; // the short name on the button; "" = the chat's @name
}

// --- Request/response messages ---

message UpsertUserRequest {
  int64 telegram_id = 1;
  string username = 2;
  string language = 3;
  string referred_by = 4;
  string referral_code = 5; // the inviter's code; used only when the user is created
}

message GetUserRequest {
  oneof lookup {
    string id = 1;
    int64 telegram_id = 2;
  }
}

message ListPlansRequest {
  bool include_disabled = 1;
  string user_id = 2; // optional: Plan.price is this user's price (a reseller's tier price)
}

message ListPlansResponse {
  repeated Plan plans = 1;
  // Every plan group, in the order customers see them (an older core sends none).
  repeated PlanGroup groups = 2;
}

message CreateOrderRequest {
  string user_id = 1;
  string plan_id = 2;
  string type = 3; // new | renew | traffic_topup
  string idempotency_key = 4;
  string subscription_id = 5; // renew | traffic_topup
  string discount_code = 6; // refused for resellers (they pay tier prices)
  // A reseller's name for the new service, at most 64 characters; ignored
  // for anyone else and on renewals and top-ups.
  string label = 7;
  // The secret of the link of a service that is not the buyer's own (FindServiceByLink): a renewal of it needs it.
  string link_secret = 8;
}

// QuoteOrderRequest prices an order before it is created, e.g. to show the
// effect of a discount code; it fails as CreateOrder would.
message QuoteOrderRequest {
  string user_id = 1;
  string plan_id = 2;
  string type = 3;
  string subscription_id = 4;
  string discount_code = 5;
  string link_secret = 6; // as CreateOrderRequest.link_secret
}

message Quote {
  common.v1.Money list_price = 1;
  common.v1.Money discount = 2;
  common.v1.Money total = 3;
  string discount_code = 4; // normalized (upper case)
}

// QuoteBulkOrderRequest prices a bulk purchase before it is made; it fails as
// CreateBulkOrder would for what can be known beforehand.
message QuoteBulkOrderRequest {
  string user_id = 1;
  string plan_id = 2;
  int32 quantity = 3;
}

message BulkQuote {
  int32 quantity = 1;
  common.v1.Money unit_price = 2; // what this user pays for one service
  common.v1.Money total = 3; // unit_price x quantity
  int32 max_quantity = 4; // the most the store allows in one purchase now
}

// CreateBulkOrderRequest buys quantity services of one plan and pays for them
// all from the wallet, all or nothing (docs/03-bot-ux.md, "Bulk purchase").
message CreateBulkOrderRequest {
  string user_id = 1;
  string plan_id = 2;
  int32 quantity = 3;
  // Required: a repeat of the request (a double tap, a retry) returns the
  // first result and charges nothing more.
  string idempotency_key = 4;
  // Names the services "<prefix> 1" .. "<prefix> N" (optional, one line, at
  // most 64 characters with the number).
  string label_prefix = 5;
  // The total the buyer was shown (optional): the purchase is refused
  // (FAILED_PRECONDITION "price changed") when it comes to anything else.
  common.v1.Money expected_total = 6;
}

message GetBulkOrderRequest {
  string bulk_id = 1;
  string user_id = 2; // when set, must be the buyer (NOT_FOUND otherwise)
}

// BulkOrder is a bulk purchase: its orders are ordinary orders, one per
// service, in the order they were made.
message BulkOrder {
  string id = 1;
  string user_id = 2;
  string plan_id = 3;
  int32 quantity = 4;
  common.v1.Money unit_price = 5;
  common.v1.Money total = 6;
  string label_prefix = 7;
  int64 created_at = 8;
  // When core announced the one message with every link (0: not yet).
  int64 delivered_at = 9;
  map<string, string> plan_name_i18n = 10;
  repeated BulkService services = 11;
  // CreateBulkOrder: the request had been made before, nothing was charged
  // again.
  bool replayed = 12;
}

// BulkService is one order of a bulk purchase and the service made for it.
message BulkService {
  int32 index = 1; // 1 to quantity
  string order_id = 2;
  string order_status = 3; // paid | provisioning | provision_failed | active | cancelled
  string subscription_id = 4; // "" until the service exists
  string status = 5; // the service's status, "" until it exists
  string label = 6;
  string subscription_link = 7; // "" until delivered
  int64 expires_at = 8;
  int64 traffic_total_bytes = 9;
}

message GetReferralInfoRequest {
  string user_id = 1;
}

message ReferralInfo {
  string code = 1; // the user's invite code (created on first request)
  int32 invited = 2;
  int32 rewarded = 3; // invited users whose first purchase paid a reward
  repeated common.v1.Money earned = 4; // per currency
  int32 reward_percent = 5; // of an invited user's first purchase; 0 = referrals are off
}

// GetTopInvitersRequest asks for one page of the top-inviters board, for the
// customer who is looking at it.
message GetTopInvitersRequest {
  string user_id = 1; // who is looking: their own invite count and place come with the page
  int32 page = 2; // 1-based; 0 = the first
  int32 page_size = 3; // places per page; 0 = 5, at most 10
}

// TopInviter is one place on the board. Nothing in it identifies a person
// whole: core masks the name and the Telegram id and never sends either in full.
message TopInviter {
  int32 rank = 1; // 1-based, in the board's order (a tie goes to whoever joined the bot first)
  string name = 2; // the @username without the @, masked: its first and last characters around ***; "***" when there is none or it is too short to show any
  string telegram_id = 3; // the Telegram id, masked the same way
  int32 invited = 4; // users who joined through this customer's invite link
  bool you = 5; // this place is the customer who asked
}

// TopInviters is a page of the board of the customers who invited the most
// people: customers only (never staff, resellers or banned users), at most 50
// places, each with at least one invited user.
message TopInviters {
  // False when the board is off (the owner switched growth.leaderboard.enabled
  // off, or the referral program is off, referral.reward_percent 0): nothing
  // else is set.
  bool enabled = 1;
  repeated TopInviter entries = 2;
  int32 page = 3;
  int32 page_size = 4;
  int32 total = 5; // places on the board, at most 50
  bool more = 6; // another page follows
  int32 your_invited = 7; // users who joined through the asking customer's link, on the board or not
  int32 your_rank = 8; // the asking customer's place on the board; 0 = not on it
}

message Discount {
  string code = 1;
  int32 percent = 2; // either a percentage...
  common.v1.Money amount = 3; // ...or a fixed amount
  int32 max_uses = 4; // 0 = unlimited
  int32 used = 5;
  int64 expires_at = 6; // unix seconds, 0 = never
  bool enabled = 7;
}

message AdminUpsertDiscountRequest {
  int64 actor_telegram_id = 1;
  Discount discount = 2;
}

message AdminListDiscountsRequest {
  int64 actor_telegram_id = 1;
}

message AdminListDiscountsResponse {
  repeated Discount discounts = 1;
}

message CreateDashboardLinkRequest {
  int64 actor_telegram_id = 1; // a staff member (owner, admin or support)
}

message ListStaffContactsRequest {
  bool include_support = 1; // ticket alerts also reach support staff
}

// StaffContact is a staff member the bot may alert (owner or admin).
message StaffContact {
  int64 telegram_id = 1;
  string language = 2;
  string role = 3; // owner or admin
}

message ListStaffContactsResponse {
  repeated StaffContact items = 1; // owners first
}

// DashboardLink is a one-time dashboard login link (works once, until expires_at).
message DashboardLink {
  string url = 1; // empty when the install has no public domain
  int64 expires_at = 2;
}

message GetOrderRequest {
  string id = 1;
}

message GetWalletRequest {
  string user_id = 1;
  string currency = 2;
}

message ListLedgerEntriesRequest {
  string user_id = 1;
  common.v1.Pagination pagination = 2;
}

message ListLedgerEntriesResponse {
  repeated LedgerEntry entries = 1;
  common.v1.PageInfo page_info = 2;
}

// ListSubscriptionsRequest without pagination and query lists the newest
// 100 (no page_info). With either, it is paged (page_size at most 50) and
// page_info carries the total.
message ListSubscriptionsRequest {
  string user_id = 1;
  common.v1.Pagination pagination = 2;
  string query = 3; // part of the label, or the end of the id (the bot's #abc123)
}

message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
  common.v1.PageInfo page_info = 2;
}

// SetSubscriptionLabelRequest names one of a reseller's services
// (PERMISSION_DENIED for anyone else; NOT_FOUND for a service not theirs).
message SetSubscriptionLabelRequest {
  string user_id = 1;
  string subscription_id = 2;
  string label = 3; // at most 64 characters; empty clears it
}

// ServiceCounts is how many services a reseller has in each status bucket
// (the deleted ones are not counted); every service is in exactly one bucket.
message ServiceCounts {
  int64 total = 1;
  int64 active = 2;
  int64 expiring_soon = 3;
  int64 expired = 4; // the time or the traffic ran out
  int64 paused = 5; // turned off (status disabled)
  int64 pending = 6; // still being delivered
}

// ListResellerServicesRequest pages through a reseller's own services, newest
// first (page_size at most 50, 10 when unset).
message ListResellerServicesRequest {
  string user_id = 1; // the reseller
  string status = 2; // "" (all) | active | expiring_soon | expired | paused | pending
  string query = 3; // part of the name, or the end of the number (#a1b2c3); at most 100 characters
  common.v1.Pagination pagination = 4;
}

message ListResellerServicesResponse {
  repeated Subscription subscriptions = 1; // each with its usage and note
  common.v1.PageInfo page_info = 2; // total: the services matching status and query
  ServiceCounts counts = 3; // all the reseller's services, whatever the filter
}

// SetResellerServiceEnabledRequest pauses (enabled = false) or resumes one of
// the reseller's services. Doing it twice changes nothing. A service staff
// paused cannot be resumed by its reseller (FAILED_PRECONDITION "paused by
// support").
message SetResellerServiceEnabledRequest {
  string user_id = 1; // the reseller
  string subscription_id = 2;
  bool enabled = 3;
}

// DeleteResellerServiceRequest deletes one of the reseller's services from the
// panel for good; nothing is refunded. Deleting it again is not an error.
message DeleteResellerServiceRequest {
  string user_id = 1; // the reseller
  string subscription_id = 2;
}

message DeleteResellerServiceResponse {}

// SetSubscriptionNoteRequest sets the private note on one of a reseller's
// services.
message SetSubscriptionNoteRequest {
  string user_id = 1; // the reseller
  string subscription_id = 2;
  string note = 3; // one line, at most 200 characters; empty clears it
}

// ListInvitedCustomersRequest pages through the users who joined through the
// reseller's invite link, newest first (page_size at most 50, 10 when unset).
message ListInvitedCustomersRequest {
  string user_id = 1; // the reseller
  common.v1.Pagination pagination = 2;
}

// InvitedCustomer is one of them, with only what the reseller may see.
message InvitedCustomer {
  int64 telegram_id = 1;
  string username = 2; // "" without a public @username
  int64 joined_at = 3; // unix seconds
  int64 paid_orders = 4; // orders that stand paid (not refunded, not free)
  repeated common.v1.Money spent = 5; // per currency
  repeated common.v1.Money commission = 6; // what their purchases paid the reseller, per currency
}

message ListInvitedCustomersResponse {
  repeated InvitedCustomer customers = 1;
  common.v1.PageInfo page_info = 2; // total: everyone who joined through the link
}

message GetResellerInfoRequest {
  string user_id = 1;
}

message ResellerBalance {
  string currency = 1;
  int64 balance = 2; // negative: what they owe
  int64 credit_limit = 3;
  int64 available = 4; // balance + credit_limit: what they can spend
}

// ResellerInfo is a reseller's panel in the bot (NOT_FOUND for anyone else).
message ResellerInfo {
  string tier_name = 1;
  int32 discount_percent = 2;
  int32 commission_percent = 3; // the reseller's own rate, else the tier's
  repeated ResellerBalance balances = 4; // per currency, IRT always listed
  int64 customers = 5; // users who joined through their link
  repeated common.v1.Money commission_earned = 6; // per currency
  string ref_code = 7; // the invite code (created on first request)
  // The prefix of the names of the reseller's configs in the 3x-ui panel ("" until
  // they choose it), and the NAME of the panel group "BOBRES-NAME" their configs are
  // in ("" until the owner gives one).
  string config_prefix = 8;
  string panel_group = 9;
}

// SetResellerConfigPrefixRequest sets the reseller's own config prefix: once (the
// owner changes it after that). The answer is their ResellerInfo.
message SetResellerConfigPrefixRequest {
  string user_id = 1;
  string prefix = 2;
}

message CreateSupportTicketRequest {
  string user_id = 1;
  string category = 2;
  string text = 3;
}

message GetSettingsRequest {}

message GetBotPhotoRequest {}

// BotPhoto is the bot's Telegram profile photo, a square JPEG.
message BotPhoto {
  string version = 1; // as Settings.bot_photo_version
  bytes jpeg = 2;
}

message UpdateBrandingRequest {
  map<string, string> values = 1;
  string actor_id = 2;
  string reason = 3;
}

message ReviewManualPaymentRequest {
  string intent_id = 1;
  string reviewer_id = 2; // ignored: the reviewer is resolved from actor_telegram_id
  string decision = 3; // approved | rejected
  string reason = 4;
  int64 actor_telegram_id = 5; // must belong to an admin or the owner
}

message PaymentIntentRef {
  string id = 1;
  string status = 2;
  string order_id = 3;
  string provider = 4;
  string instructions = 5; // rendered payment instructions for the user
  common.v1.Money amount = 6;
  // Structured details so the bot can render instructions in the user's
  // language: card_number, card_holder, usdt_trc20, usdt_erc20, reference.
  map<string, string> details = 7;
  // Automated gateways: where to pay (Zarinpal), what is charged
  // there (XTR for a Stars invoice), and the invoice title.
  string pay_url = 8;
  common.v1.Money gateway_amount = 9;
  string description = 10;
  string failure_reason = 11;
}

message CheckPaymentRequest {
  string user_id = 1; // must own the intent
  string intent_id = 2;
}

// StarsPreCheckoutRequest relays a Telegram Stars pre_checkout_query.
message StarsPreCheckoutRequest {
  string user_id = 1;
  string intent_id = 2; // the invoice payload
  int64 total_amount = 3;
  string currency = 4;
}

// StarsPaidRequest relays a Telegram Stars successful_payment.
message StarsPaidRequest {
  string user_id = 1;
  string intent_id = 2; // the invoice payload
  int64 total_amount = 3;
  string currency = 4;
  string telegram_payment_charge_id = 5;
}

message ListPaymentMethodsRequest {
  string currency = 1; // the plan's currency, e.g. IRT
  int64 amount = 2; // the price in minor units, to apply each method's limits (0 = any)
}

message ListPaymentMethodsResponse {
  repeated string providers = 1; // automated methods usable now, e.g. zarinpal, stars
}

message SubmitPaymentProofRequest {
  string user_id = 1;
  string intent_id = 2;
  // Card payments: receipt photo (Telegram file_id) and bank reference number.
  string receipt_file = 3;
  string reference_number = 4;
  // Crypto payments: network and transaction id.
  string network = 5;
  string txid = 6;
}

message GetSubscriptionLinksRequest {
  string user_id = 1; // must own the subscription
  string subscription_id = 2;
}

message SubscriptionLinks {
  string subscription_link = 1;
  bytes qr_png = 2;
  repeated string config_links = 3;
  // The branded page of the service, "" while the page is off or the store has no public address.
  string page_url = 4;
}

// --- Admin RPCs: actor_telegram_id must belong to an active admin or owner.
// Every change is written to the audit log with the actor and the reason.

message AdminGetStatsRequest {
  int64 actor_telegram_id = 1;
}

message AdminStats {
  int64 users_total = 1;
  int64 users_today = 2;
  int64 active_subscriptions = 3;
  int64 pending_payments = 4;
  int64 provision_failed_orders = 5;
  // Every server taking new services answers (servers_* below); the detail
  // says why not, in English.
  bool panel_healthy = 6;
  string panel_detail = 7;
  // The 3x-ui servers from the provisioner's list. servers_known is false
  // when the provisioner did not answer. Only the servers taking new
  // services count (the others are not checked): servers_healthy of
  // servers_total answered their last health check or are not checked yet,
  // and servers_down names the others.
  bool servers_known = 8;
  int32 servers_total = 9;
  int32 servers_healthy = 10;
  repeated string servers_down = 11;
  // Every server of the list, the switched-off ones included: 0 means no
  // 3x-ui server was added yet.
  int32 servers_listed = 12;
}

message AdminListPendingPaymentsRequest {
  int64 actor_telegram_id = 1;
  int32 limit = 2;
}

message PendingPayment {
  string intent_id = 1;
  string order_id = 2;
  User user = 3;
  string provider = 4;
  common.v1.Money amount = 5;
  string receipt_file = 6;
  string reference_number = 7;
  string network = 8;
  string txid = 9;
  int64 submitted_at = 10;
  bool possible_duplicate = 11;
}

message AdminListPendingPaymentsResponse {
  repeated PendingPayment payments = 1;
}

message AdminGetPaymentRequest {
  int64 actor_telegram_id = 1; // must belong to an admin or an owner
  string intent_id = 2;
}

// AdminPaymentView is one manual payment as staff see it: the proof and the
// payer, and how it ended once someone has decided.
message AdminPaymentView {
  PendingPayment payment = 1;
  string status = 2; // confirming while it waits for a decision, then succeeded or failed
  string decision = 3; // empty while nobody has decided, else approved | rejected
  string reason = 4; // why it was rejected: "preset:<name>" or the reviewer's words
  User reviewer = 5; // who decided; unset while pending (or when they are gone)
  int64 reviewed_at = 6; // unix seconds; 0 while pending
}

message AdminFindUserRequest {
  int64 actor_telegram_id = 1;
  string query = 2; // Telegram id or @username
}

message AdminUserView {
  User user = 1;
  repeated Wallet wallets = 2;
  int64 subscriptions = 3;
  int64 orders = 4;
}

message AdminAdjustBalanceRequest {
  int64 actor_telegram_id = 1;
  string user_id = 2;
  common.v1.Money delta = 3; // signed; the balance can never go below zero (-credit_limit for a reseller)
  string reason = 4;
  string idempotency_key = 5;
}

message AdminSetUserStatusRequest {
  int64 actor_telegram_id = 1;
  string user_id = 2;
  string status = 3; // active | banned
  string reason = 4;
}

message AdminUpsertPlanRequest {
  int64 actor_telegram_id = 1;
  Plan plan = 2; // empty id creates a plan
}

message AdminSetSettingRequest {
  int64 actor_telegram_id = 1;
  string key = 2; // one of the documented setting keys
  string value = 3; // plain text
}

message PayOrderWithWalletRequest {
  string order_id = 1;
  // Kept for compatibility; the order id is the idempotency anchor (one order
  // can only ever be charged once).
  string idempotency_key = 2;
  string user_id = 3; // when set, must own the order
}

message CreatePaymentIntentRequest {
  string user_id = 1;
  string order_id = 2;        // empty for wallet top-up intents
  string provider = 3;        // manual_card | manual_crypto | zarinpal | stars
  common.v1.Money amount = 4; // required when order_id is empty
  string idempotency_key = 5;
}

message StartTrialRequest {
  string user_id = 1;
  string plan_id = 2;
  string idempotency_key = 3;
}

// CoreService owns users, plans, orders, wallet ledger, subscriptions,
// audit log, branding/settings, and the dashboard API backing store.
service CoreService {
  rpc UpsertUser(UpsertUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc GetWallet(GetWalletRequest) returns (Wallet);
  rpc ListLedgerEntries(ListLedgerEntriesRequest) returns (ListLedgerEntriesResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  // FindServiceByLink finds the service a subscription link (or the branded page's address) belongs to: NotFound when none does,
  // InvalidArgument when the text is not a link. For a service that is not the caller's, only what the link already shows is returned.
  rpc FindServiceByLink(FindServiceByLinkRequest) returns (FoundService);
  rpc CreateSupportTicket(CreateSupportTicketRequest) returns (Ticket);
  rpc GetSettings(GetSettingsRequest) returns (Settings);
  // UpdateBranding is not served (Unimplemented): branding is changed with
  // AdminSetSetting or the dashboard, which check and audit every value.
  rpc UpdateBranding(UpdateBrandingRequest) returns (Settings) {
    option deprecated = true;
  }
  rpc ReviewManualPayment(ReviewManualPaymentRequest) returns (PaymentIntentRef);
  rpc PayOrderWithWallet(PayOrderWithWalletRequest) returns (Order);
  rpc CreatePaymentIntent(CreatePaymentIntentRequest) returns (PaymentIntentRef);
  rpc StartTrial(StartTrialRequest) returns (Order);
  rpc CanStartTrial(CanStartTrialRequest) returns (CanStartTrialResponse);
  rpc SubmitPaymentProof(SubmitPaymentProofRequest) returns (PaymentIntentRef);
  rpc CheckPayment(CheckPaymentRequest) returns (PaymentIntentRef);
  rpc StarsPreCheckout(StarsPreCheckoutRequest) returns (PaymentIntentRef);
  rpc StarsPaid(StarsPaidRequest) returns (PaymentIntentRef);
  rpc ListPaymentMethods(ListPaymentMethodsRequest) returns (ListPaymentMethodsResponse);
  rpc GetSubscriptionLinks(GetSubscriptionLinksRequest) returns (SubscriptionLinks);
  rpc AdminGetStats(AdminGetStatsRequest) returns (AdminStats);
  rpc AdminListPendingPayments(AdminListPendingPaymentsRequest) returns (AdminListPendingPaymentsResponse);
  // AdminGetPayment shows one manual payment: pending, or how it was decided
  // and by whom (staff alerts open a payment that another owner may have
  // decided already).
  rpc AdminGetPayment(AdminGetPaymentRequest) returns (AdminPaymentView);
  rpc AdminFindUser(AdminFindUserRequest) returns (AdminUserView);
  rpc AdminAdjustBalance(AdminAdjustBalanceRequest) returns (Wallet);
  rpc AdminSetUserStatus(AdminSetUserStatusRequest) returns (User);
  rpc AdminUpsertPlan(AdminUpsertPlanRequest) returns (Plan);
  rpc AdminSetSetting(AdminSetSettingRequest) returns (Settings);
  rpc QuoteOrder(QuoteOrderRequest) returns (Quote);
  // Bulk purchase: N services of one plan paid from the wallet in one
  // transaction (all or nothing, idempotent by the request key), then
  // provisioned like any order. GetBulkOrder gives the services of one, with
  // their links once they are delivered (for the bot's one message).
  rpc QuoteBulkOrder(QuoteBulkOrderRequest) returns (BulkQuote);
  rpc CreateBulkOrder(CreateBulkOrderRequest) returns (BulkOrder);
  rpc GetBulkOrder(GetBulkOrderRequest) returns (BulkOrder);
  rpc GetReferralInfo(GetReferralInfoRequest) returns (ReferralInfo);
  // GetTopInviters is a page of the top-inviters board (the bot's "Top users"):
  // enabled is false while the board is off. NOT_FOUND for an unknown user.
  rpc GetTopInviters(GetTopInvitersRequest) returns (TopInviters);
  rpc AdminUpsertDiscount(AdminUpsertDiscountRequest) returns (Discount);
  rpc AdminListDiscounts(AdminListDiscountsRequest) returns (AdminListDiscountsResponse);
  rpc CreateDashboardLink(CreateDashboardLinkRequest) returns (DashboardLink);
  // ListStaffContacts lists the active owners and admins, for staff alerts.
  rpc ListStaffContacts(ListStaffContactsRequest) returns (ListStaffContactsResponse);
  // Support tickets (milestone 4). CreateSupportTicket stays for older bots.
  rpc AddTicketMessage(AddTicketMessageRequest) returns (AddTicketMessageResponse);
  rpc GetMyTickets(GetMyTicketsRequest) returns (MyTickets);
  rpc GetMyTicket(GetMyTicketRequest) returns (TicketThread);
  rpc CloseMyTicket(CloseMyTicketRequest) returns (Ticket);
  rpc GetTicketMessage(GetTicketMessageRequest) returns (TicketMessageView);
  rpc ReportTicketDelivery(ReportTicketDeliveryRequest) returns (ReportTicketDeliveryResponse);
  // Broadcasts (milestone 4): the bot claims recipients and reports results.
  rpc SetUserBotBlocked(SetUserBotBlockedRequest) returns (SetUserBotBlockedResponse);
  rpc ClaimBroadcastBatch(ClaimBroadcastBatchRequest) returns (BroadcastBatch);
  rpc ReportBroadcastResults(ReportBroadcastResultsRequest) returns (BroadcastState);
  // Resellers (milestone 5).
  rpc SetSubscriptionLabel(SetSubscriptionLabelRequest) returns (Subscription);
  rpc GetResellerInfo(GetResellerInfoRequest) returns (ResellerInfo);
  // SetResellerConfigPrefix: InvalidArgument for a prefix core refuses (the shape, or
  // another reseller has it), FailedPrecondition when the reseller set theirs already.
  rpc SetResellerConfigPrefix(SetResellerConfigPrefixRequest) returns (ResellerInfo);
  // Reseller management: a reseller's own services (list with status filters
  // and counts, pause and resume, delete, a private note) and the customers
  // who joined through their invite link. Every call is the reseller's own:
  // core checks they are an active reseller and that resellers are in the
  // install's license, answers PERMISSION_DENIED otherwise (banned: "user is
  // banned"), and NOT_FOUND for a service that is not theirs.
  rpc ListResellerServices(ListResellerServicesRequest) returns (ListResellerServicesResponse);
  rpc SetResellerServiceEnabled(SetResellerServiceEnabledRequest) returns (Subscription);
  rpc DeleteResellerService(DeleteResellerServiceRequest) returns (DeleteResellerServiceResponse);
  rpc SetSubscriptionNote(SetSubscriptionNoteRequest) returns (Subscription);
  rpc ListInvitedCustomers(ListInvitedCustomersRequest) returns (ListInvitedCustomersResponse);
  // GetBotPhoto returns the bot photo, for the bot to set in Telegram when
  // Settings.bot_photo_version changes; NOT_FOUND when there is none.
  rpc GetBotPhoto(GetBotPhotoRequest) returns (BotPhoto);
  // Help content (help.proto): the enabled questions or tutorials of a kind in
  // the customer's language (the other one where a translation is missing), in
  // the owner's order, and one of them. PERMISSION_DENIED for a banned
  // customer, NOT_FOUND for an unknown customer, and for an entry that is gone
  // or switched off (GetHelpEntry).
  rpc ListHelpEntries(ListHelpEntriesRequest) returns (ListHelpEntriesResponse);
  rpc GetHelpEntry(GetHelpEntryRequest) returns (HelpEntry);
  // The bot's button-driven admin menu (WP-D). Every call is the actor's own:
  // core checks the role again and audits each change like the dashboard does.
  rpc AdminTodayStats(AdminTodayStatsRequest) returns (AdminTodayStatsResponse);
  rpc AdminListSettingSpecs(AdminListSettingSpecsRequest) returns (AdminListSettingSpecsResponse);
  rpc AdminListServers(AdminListServersRequest) returns (AdminListServersResponse);
  rpc AdminSetServer(AdminSetServerRequest) returns (AdminServer);
  rpc AdminListStaff(AdminListStaffRequest) returns (AdminListStaffResponse);
  rpc AdminAddStaff(AdminAddStaffRequest) returns (AdminStaffMember);
  rpc AdminRemoveStaff(AdminRemoveStaffRequest) returns (AdminRemoveStaffResponse);
  rpc AdminBroadcast(AdminBroadcastRequest) returns (AdminBroadcastResponse);
  // RedeemGiftCode applies a gift code to the customer's wallet (docs/03-bot-ux.md):
  // an active account only (a banned one is PERMISSION_DENIED "user is banned").
  // What a customer can get wrong is an outcome of the answer, not an error.
  rpc RedeemGiftCode(RedeemGiftCodeRequest) returns (RedeemGiftCodeResponse);

  // License sales (docs/13-license-server.md): the owner's own bot sells BOBRES licenses, paid from the wallet in
  // USDT. Off on every other store: ListVendorOffers says so and the others are refused. BuyVendorLicense is
  // once-only per idempotency key; a refusal for being short of money is FAILED_PRECONDITION "insufficient funds".
  rpc ListVendorOffers(ListVendorOffersRequest) returns (ListVendorOffersResponse);
  rpc BuyVendorLicense(BuyVendorLicenseRequest) returns (BuyVendorLicenseResponse);
  rpc ListMyVendorLicenses(ListMyVendorLicensesRequest) returns (ListMyVendorLicensesResponse);
  rpc GetVendorLicenseKey(GetVendorLicenseKeyRequest) returns (GetVendorLicenseKeyResponse);
  // A customer short of money taps a payment method for the shortfall: this records what they meant to buy, and when the payment lands and the
  // wallet covers it core buys it by itself (and the bot is told by license.order_settled.v1). One intent per customer; it lasts 12 hours.
  rpc SetVendorIntent(SetVendorIntentRequest) returns (SetVendorIntentResponse);

  // Digital accounts resold from a supplier (docs/supplier.md): the owner's own store only; off everywhere else
  // (ListSupplierOffers says so). BuySupplierProduct is once-only per idempotency key and is paid from the wallet in
  // Toman; "insufficient funds" is FAILED_PRECONDITION. What was delivered (an account) is a secret: GetSupplierDelivery
  // shows it again to its buyer only.
  rpc ListSupplierOffers(ListSupplierOffersRequest) returns (ListSupplierOffersResponse);
  rpc BuySupplierProduct(BuySupplierProductRequest) returns (BuySupplierProductResponse);
  rpc ListMySupplierOrders(ListMySupplierOrdersRequest) returns (ListMySupplierOrdersResponse);
  rpc GetSupplierDelivery(GetSupplierDeliveryRequest) returns (GetSupplierDeliveryResponse);
}

message CanStartTrialRequest {
  string user_id = 1;
}

message CanStartTrialResponse {
  bool eligible = 1;
}

// ---- The bot's admin menu (WP-D) ----

message AdminTodayStatsRequest {
  int64 actor_telegram_id = 1;
}

// AdminDayLine is one currency of a day. Money of different currencies is
// never added together.
message AdminDayLine {
  string currency = 1;
  int64 revenue = 2; // what customers paid for orders, minor units
  int64 orders = 3;
  int64 refunds = 4; // refunded amount, minor units
}

message AdminDay {
  string date = 1; // the store's local date, YYYY-MM-DD
  repeated AdminDayLine lines = 2; // sorted by currency
  int64 new_customers = 3;
}

message AdminTodayStatsResponse {
  string tz = 1;
  AdminDay today = 2;
  AdminDay yesterday = 3;
}

message AdminListSettingSpecsRequest {
  int64 actor_telegram_id = 1;
}

// AdminSettingSpec is one setting as the caller may see it, with its current
// value. Settings the caller may not change are left out.
message AdminSettingSpec {
  string key = 1;
  string group = 2;
  string kind = 3; // text | int | bool | enum | tz | url | channel | color
  string default_value = 4;
  int64 min = 5;
  int64 max = 6;
  repeated string options = 7;
  int32 max_len = 8;
  string help = 9; // English, from core; the bot prefers its own translation
  string value = 10; // "" when unset
}

message AdminListSettingSpecsResponse {
  repeated AdminSettingSpec specs = 1;
}

message AdminListServersRequest {
  int64 actor_telegram_id = 1;
}

message AdminServer {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  int32 weight = 4;
  bool health_known = 5; // a health check has run
  bool healthy = 6;
  string health_error = 7;
  int64 clients = 8;
  string managed = 9; // env | dashboard
}

message AdminListServersResponse {
  repeated AdminServer servers = 1;
}

// AdminSetServerRequest switches a server on or off and sets its weight.
// Nothing else changes and the panel is never contacted. Owner only.
message AdminSetServerRequest {
  int64 actor_telegram_id = 1;
  string server_id = 2;
  bool enabled = 3;
  int32 weight = 4; // 0 keeps the current weight
}

message AdminListStaffRequest {
  int64 actor_telegram_id = 1;
}

message AdminStaffMember {
  string user_id = 1;
  int64 telegram_id = 2;
  string username = 3;
  string role = 4; // support | admin | owner
  string status = 5;
  bool configured_owner = 6; // named by the server's settings, never changed here
}

message AdminListStaffResponse {
  repeated AdminStaffMember staff = 1;
}

// AdminAddStaffRequest gives a role to someone who has started the bot, or,
// when the person already is staff, changes their role. Owner only.
message AdminAddStaffRequest {
  int64 actor_telegram_id = 1;
  int64 target_telegram_id = 2;
  string role = 3;
  string reason = 4;
}

message AdminRemoveStaffRequest {
  int64 actor_telegram_id = 1;
  int64 target_telegram_id = 2;
  string reason = 3;
}

message AdminRemoveStaffResponse {}

// AdminBroadcastRequest checks a broadcast (send = false: its audience and the
// normalised texts, nothing saved) or sends it now (send = true).
message AdminBroadcastRequest {
  int64 actor_telegram_id = 1;
  string segment = 2; // all | active | expired | never_bought
  string language = 3; // "" (everyone) | fa | en
  map<string, string> texts = 4; // by language
  string button_url = 5;
  map<string, string> button_labels = 6; // by language
  bool send = 7;
}

message AdminBroadcastResponse {
  int64 audience = 1;
  int64 audience_fa = 2;
  int64 audience_en = 3;
  map<string, string> texts = 4; // normalised
  map<string, string> button_labels = 5;
  string broadcast_id = 6; // set once sent
}

// How a gift code request ended. Everything a customer can get wrong is an
// outcome, so the bot answers in their words; an error stays for a broken
// request, a banned customer (PERMISSION_DENIED) and a backend that is down.
enum GiftCodeOutcome {
  GIFT_CODE_OUTCOME_UNSPECIFIED = 0;
  GIFT_CODE_OUTCOME_REDEEMED = 1; // credited, or (replayed) credited by this very request before
  // Unknown, switched off or expired, or not a code at all: one answer for all
  // of them, so nothing tells a guesser which codes exist. Each counts as a
  // wrong code (five in an hour close entering codes for an hour).
  GIFT_CODE_OUTCOME_INVALID = 2;
  GIFT_CODE_OUTCOME_USED_UP = 3; // told only to someone who sent the whole code
  GIFT_CODE_OUTCOME_ALREADY_REDEEMED = 4; // this customer used the code as often as they may
  GIFT_CODE_OUTCOME_LOCKED = 5; // too many wrong codes: retry_after_seconds
  GIFT_CODE_OUTCOME_OFF = 6; // the owner switched gift codes off (or core cannot key them)
}

message RedeemGiftCodeRequest {
  string user_id = 1;
  string code = 2; // as the customer typed it: core reads capitals, digits and separators any way they are written
  // Identifies the request (the bot uses the customer's message): sent again
  // with the same key, it credits nothing more and answers the same.
  string idempotency_key = 3;
}

message RedeemGiftCodeResponse {
  GiftCodeOutcome outcome = 1;
  common.v1.Money credited = 2; // REDEEMED: what was added to the wallet
  common.v1.Money balance = 3; // REDEEMED: the wallet's balance now
  int64 retry_after_seconds = 4; // LOCKED: how long entering codes stays closed
  bool replayed = 5; // REDEEMED: this request was served before; nothing was credited this time
}

// One thing the owner's bot sells: a tier for a term, and what it costs.
message VendorOffer {
  string tier = 1; // standard or pro
  int32 months = 2; // 1 or 12
  common.v1.Money price = 3;
}

message ListVendorOffersRequest {
  string user_id = 1;
}

message ListVendorOffersResponse {
  bool on = 1; // license sales are on in this store
  repeated VendorOffer offers = 2;
  common.v1.Money balance = 3; // the buyer's wallet in the offers' currency
}

// BuyVendorLicenseRequest buys a new license, or (license_id set) renews one the buyer owns for months more.
message BuyVendorLicenseRequest {
  string user_id = 1;
  string tier = 2; // a new license's tier (a renewal keeps its own)
  int32 months = 3;
  string license_id = 4; // a renewal: the id of a VendorLicense of this buyer
  // Required: a repeat of the request (a double tap) returns the first result and charges nothing more.
  string idempotency_key = 5;
  // The price the buyer was shown (optional): refused as FAILED_PRECONDITION "price changed" if it came to another.
  common.v1.Money expected_price = 6;
}

message VendorLicense {
  string id = 1;
  string tier = 2;
  int64 ends_at = 3; // unix seconds; 0 = no end date
  string status = 4; // active or revoked
}

message BuyVendorLicenseResponse {
  // done: the license exists (or was renewed). paid: the buyer has paid and the license server has not answered yet;
  // the key arrives in a message when it does. refunded: the license server refused for good and the money went back.
  string order_status = 1;
  VendorLicense license = 2; // done
  string key = 3; // done, a new license: its activation key
  common.v1.Money price = 4;
  bool replayed = 5;
  string failure = 6; // refunded: why
}

message ListMyVendorLicensesRequest {
  string user_id = 1;
}

message ListMyVendorLicensesResponse {
  repeated VendorLicense licenses = 1;
}

message SetVendorIntentRequest {
  string user_id = 1;
  string tier = 2;         // standard or pro (for a new license)
  int32 months = 3;        // 1 or 12
  string license_id = 4;   // a renewal of this license of theirs (its tier is kept); empty: a new license
}

message SetVendorIntentResponse {}

message GetVendorLicenseKeyRequest {
  string user_id = 1;
  string license_id = 2;
}

message GetVendorLicenseKeyResponse {
  VendorLicense license = 1;
  string key = 2;
}

// A product the owner sells from the supplier. sid is a short id the bot puts in its buttons (core finds the product by it).
message SupplierOffer {
  string sid = 1;
  string name = 2; // in the customer's language when the owner wrote one
  string description = 3;
  common.v1.Money price = 4;
  // false: sold out right now (no stock, or the supplier no longer lists it); the description can still be read, it cannot be bought.
  // An older core never sends it (the bot then treats the offer as available).
  bool sold_out = 5;
  // The supplier's own category of the product ("Telegram Premium", "VPN"...), without custom-emoji placeholders; empty when the supplier names
  // none. The bot groups the offers by it. An older core never sends it (the bot then lists the offers flat).
  string category = 6;
  // How many the supplier has: set when the supplier says (stock_known), so the bot can show it and offer no more than that.
  int32 stock = 7;
  bool stock_known = 8;
}

message ListSupplierOffersRequest {
  string user_id = 1;
  string language = 2; // fa or en
}

message ListSupplierOffersResponse {
  bool on = 1; // the owner sells digital accounts in this store
  repeated SupplierOffer offers = 2;
  common.v1.Money balance = 3; // the buyer's wallet
}

message BuySupplierProductRequest {
  string user_id = 1;
  string sid = 2;
  int32 quantity = 3;
  string idempotency_key = 4; // required: a repeat returns the first result and charges nothing more
  common.v1.Money expected_total = 5; // the total the buyer was shown (optional): refused as "price changed" otherwise
}

message BuySupplierProductResponse {
  // done: delivered. paid: the buyer has paid and the supplier has not delivered yet (it arrives under My purchases).
  // refunded: the supplier refused for good and the money went back.
  string order_status = 1;
  string order_id = 2;
  string delivery = 3; // done: what the customer receives
  common.v1.Money total = 4;
  bool replayed = 5;
  string failure = 6;
}

message SupplierOrderSummary {
  string id = 1;
  string product_name = 2;
  int32 quantity = 3;
  common.v1.Money total = 4;
  string status = 5; // paid, done or refunded
  int64 created_at = 6;
}

message ListMySupplierOrdersRequest {
  string user_id = 1;
  string language = 2;
}

message ListMySupplierOrdersResponse {
  repeated SupplierOrderSummary orders = 1;
}

message GetSupplierDeliveryRequest {
