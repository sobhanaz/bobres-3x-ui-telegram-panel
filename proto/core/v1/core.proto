syntax = "proto3";

package core.v1;

import "common/v1/types.proto";

option go_package = "github.com/sobhanaz/bobres-3x-ui-telegram-panel/gen/proto/core/v1;corev1";

// --- Domain messages ---

message User {
  string id = 1; // uuid
  int64 telegram_id = 2;
  string username = 3;
  string language = 4; // fa | en
  string role = 5; // user | support | admin | owner | reseller
  string status = 6; // active | banned
  string referred_by = 7; // uuid, optional
  int64 created_at = 8; // unix seconds
  int64 updated_at = 9;
  bool bot_blocked = 10; // Telegram said the user blocked the bot
}

message Plan {
  string id = 1; // uuid
  map<string, string> name_i18n = 2; // lang -> name
  string kind = 3; // traffic | time | both
  int32 duration_days = 4;
  int64 traffic_bytes = 5;
  common.v1.Money price = 6;
  bool enabled = 7;
  bool is_trial = 8;
  int32 sort = 9;
  bool is_topup = 10; // a traffic package for an existing subscription
  // The store price. price is what the user ListPlans was asked for pays (a
  // reseller's tier price); without a user both are the store price.
  common.v1.Money list_price = 11;
}

message Order {
  string id = 1; // uuid
  string user_id = 2;
  string plan_id = 3;
  string type = 4; // new | renew | traffic_topup
  string status = 5; // created|awaiting_payment|paid|provisioning|active|provision_failed|cancelled|expired
  common.v1.Money amount = 6;
  string idempotency_key = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  string subscription_id = 10; // renew | traffic_topup: the subscription extended
  string discount_code = 11;
  common.v1.Money discount = 12; // already taken off amount
  string label = 13; // a reseller's name for the service it creates
}

message Wallet {
  string user_id = 1;
  string currency = 2;
  int64 balance = 3; // a reseller's may be negative: what they owe
  int64 updated_at = 4;
  int64 credit_limit = 5; // resellers: the balance may go down to -credit_limit (0 for everyone else)
}

message LedgerEntry {
  string id = 1;
  string user_id = 2;
  string currency = 3;
  int64 amount = 4;
  string kind = 5; // topup | purchase | refund | adjust | trial_grant | referral | commission | settlement
  string ref_type = 6;
  string ref_id = 7;
  string idempotency_key = 8;
  int64 balance_after = 9;
  int64 created_at = 10;
}

message Subscription {
  string id = 1;
  string user_id = 2;
  string order_id = 3;
  string server_id = 4;
  string client_email = 5;
  string sub_id = 6;
  string status = 7; // pending|active|expiring_soon|expired|disabled|depleted
  int64 expires_at = 8;
  int64 traffic_total_bytes = 9;
  int64 traffic_used_bytes = 10;
  int64 last_synced_at = 11;
  string subscription_link = 12; // set once provisioned
  string label = 13; // the name a reseller gave it ("" = none)
}

message Ticket {
  string id = 1;
  string user_id = 2;
  string category = 3; // payment | service | other (general on old tickets)
  string text = 4; // the subject: the first line of the first message
  string status = 5; // open (waiting for staff) | answered | closed
  int64 created_at = 6;
  int64 number = 7; // what customers and staff call it (#1024)
  int64 updated_at = 8;
  string last_from = 9; // customer | staff: who wrote last
}

// TicketMessage is one message of a ticket as the customer sees it (staff
// notes are never sent to the bot).
message TicketMessage {
  string id = 1;
  string kind = 2; // customer | staff
  string body = 3;
  bool has_file = 4;
  int64 created_at = 5;
}

message AddTicketMessageRequest {
  string user_id = 1;
  string category = 2; // for a new ticket: payment | service | other
  string ticket_id = 3; // optional: the ticket the customer answers (a button)
  int64 reply_to_tg_message_id = 4; // optional: the delivered staff reply the customer answered
  string text = 5;
  string file_id = 6; // Telegram file id of a photo, image or PDF
  string file_type = 7; // photo | document
  string file_mime = 8;
  string file_name = 9;
  int64 file_size = 10;
  int64 tg_message_id = 11; // the customer's message: makes a repeat harmless
  // With reply_to_tg_message_id: only says whether it is this customer's
  // delivered staff reply (NOT_FOUND otherwise); nothing is saved.
  bool check_only = 12;
}

message AddTicketMessageResponse {
  Ticket ticket = 1;
  string message_id = 2;
  bool created = 3; // false: this Telegram message was recorded already
  bool new_ticket = 4;
  int64 closed_number = 5; // the closed ticket the customer answered (a new one was started)
}

message GetMyTicketsRequest {
  string user_id = 1;
  int32 limit = 2; // recent tickets, at most 10
}

message MyTickets {
  Ticket open = 1; // the ticket that is not closed, if any
  repeated Ticket recent = 2;
}

message GetMyTicketRequest {
  string user_id = 1;
  string ticket_id = 2;
  int32 last = 3; // the last N messages (default 3, at most 20)
}

message TicketThread {
  Ticket ticket = 1;
  repeated TicketMessage messages = 2; // oldest first
}

message CloseMyTicketRequest {
  string user_id = 1;
  string ticket_id = 2;
}

message GetTicketMessageRequest {
  string message_id = 1;
}

// TicketMessageView is what the notifier needs to deliver a reply or alert
// staff about a customer's message.
message TicketMessageView {
  string ticket_id = 1;
  int64 ticket_number = 2;
  int64 telegram_id = 3; // the customer
  string language = 4; // the customer's
  string username = 5; // the customer's
  string kind = 6; // customer | staff | note
  string body = 7;
  bool has_file = 8;
  string delivery = 9; // staff replies: pending | sent | blocked | failed
  bool closed = 10; // the ticket is closed
  string category = 11;
  string url = 12; // the ticket in the dashboard ("" without a public https address)
  string file_id = 13;
  string file_type = 14;
}

message ReportTicketDeliveryRequest {
  string message_id = 1;
  string status = 2; // sent | blocked | failed
  int64 tg_message_id = 3; // the delivered copy (sent)
}

message ReportTicketDeliveryResponse {}

message SetUserBotBlockedRequest {
  int64 telegram_id = 1;
  bool blocked = 2;
}

message SetUserBotBlockedResponse {}

message ClaimBroadcastBatchRequest {
  int32 limit = 1; // at most 100
}

message BroadcastRecipient {
  string user_id = 1;
  int64 telegram_id = 2;
  string language = 3;
}

message BroadcastBatch {
  string broadcast_id = 1; // empty: nothing to send now
  map<string, string> texts = 2; // language -> HTML text
  string button_url = 3; // empty: no button
  map<string, string> button_labels = 4;
  repeated BroadcastRecipient recipients = 5;
}

enum BroadcastOutcome {
  BROADCAST_OUTCOME_UNSPECIFIED = 0;
  BROADCAST_OUTCOME_SENT = 1;
  BROADCAST_OUTCOME_BLOCKED = 2; // the user blocked the bot (or deleted their account)
  BROADCAST_OUTCOME_FAILED = 3; // Telegram refused this message
  BROADCAST_OUTCOME_UNKNOWN = 4; // sent, but no answer: never retried
  BROADCAST_OUTCOME_RELEASED = 5; // not attempted (pause, cancel, shutdown): back in line
}

message BroadcastResult {
  string user_id = 1;
  BroadcastOutcome outcome = 2;
  int64 message_id = 3;
  string error = 4;
}

message ReportBroadcastResultsRequest {
  string broadcast_id = 1;
  repeated BroadcastResult results = 2;
  string halt_reason = 3; // non-empty: pause the broadcast and say why
}

message BroadcastState {
  string status = 1; // running | paused | cancelled | done
}

message Settings {
  map<string, string> values = 1; // flattened key -> JSON-encoded value
  // The bot photo's version: when it was uploaded, in unix nanoseconds; ""
  // when the store has none, "?" when core could not read it (the bot then
  // leaves its photo as it is). An older core never sets it.
  string bot_photo_version = 2;
}

// --- Request/response messages ---

message UpsertUserRequest {
  int64 telegram_id = 1;
  string username = 2;
  string language = 3;
  string referred_by = 4;
  string referral_code = 5; // the inviter's code; used only when the user is created
}

message GetUserRequest {
  oneof lookup {
    string id = 1;
    int64 telegram_id = 2;
  }
}

message ListPlansRequest {
  bool include_disabled = 1;
  string user_id = 2; // optional: Plan.price is this user's price (a reseller's tier price)
}

message ListPlansResponse {
  repeated Plan plans = 1;
}

message CreateOrderRequest {
  string user_id = 1;
  string plan_id = 2;
  string type = 3; // new | renew | traffic_topup
  string idempotency_key = 4;
  string subscription_id = 5; // renew | traffic_topup
  string discount_code = 6; // refused for resellers (they pay tier prices)
  // A reseller's name for the new service, at most 64 characters; ignored
  // for anyone else and on renewals and top-ups.
  string label = 7;
}

// QuoteOrderRequest prices an order before it is created, e.g. to show the
// effect of a discount code; it fails as CreateOrder would.
message QuoteOrderRequest {
  string user_id = 1;
  string plan_id = 2;
  string type = 3;
  string subscription_id = 4;
  string discount_code = 5;
}

message Quote {
  common.v1.Money list_price = 1;
  common.v1.Money discount = 2;
  common.v1.Money total = 3;
  string discount_code = 4; // normalized (upper case)
}

message GetReferralInfoRequest {
  string user_id = 1;
}

message ReferralInfo {
  string code = 1; // the user's invite code (created on first request)
  int32 invited = 2;
  int32 rewarded = 3; // invited users whose first purchase paid a reward
  repeated common.v1.Money earned = 4; // per currency
  int32 reward_percent = 5; // of an invited user's first purchase; 0 = referrals are off
}

message Discount {
  string code = 1;
  int32 percent = 2; // either a percentage...
  common.v1.Money amount = 3; // ...or a fixed amount
  int32 max_uses = 4; // 0 = unlimited
  int32 used = 5;
  int64 expires_at = 6; // unix seconds, 0 = never
  bool enabled = 7;
}

message AdminUpsertDiscountRequest {
  int64 actor_telegram_id = 1;
  Discount discount = 2;
}

message AdminListDiscountsRequest {
  int64 actor_telegram_id = 1;
}

message AdminListDiscountsResponse {
  repeated Discount discounts = 1;
}

message CreateDashboardLinkRequest {
  int64 actor_telegram_id = 1; // a staff member (owner, admin or support)
}

message ListStaffContactsRequest {
  bool include_support = 1; // ticket alerts also reach support staff
}

// StaffContact is a staff member the bot may alert (owner or admin).
message StaffContact {
  int64 telegram_id = 1;
  string language = 2;
  string role = 3; // owner or admin
}

message ListStaffContactsResponse {
  repeated StaffContact items = 1; // owners first
}

// DashboardLink is a one-time dashboard login link (works once, until expires_at).
message DashboardLink {
  string url = 1; // empty when the install has no public domain
  int64 expires_at = 2;
}

message GetOrderRequest {
  string id = 1;
}

message GetWalletRequest {
  string user_id = 1;
  string currency = 2;
}

message ListLedgerEntriesRequest {
  string user_id = 1;
  common.v1.Pagination pagination = 2;
}

message ListLedgerEntriesResponse {
  repeated LedgerEntry entries = 1;
  common.v1.PageInfo page_info = 2;
}

// ListSubscriptionsRequest without pagination and query lists the newest
// 100 (no page_info). With either, it is paged (page_size at most 50) and
// page_info carries the total.
message ListSubscriptionsRequest {
  string user_id = 1;
  common.v1.Pagination pagination = 2;
  string query = 3; // part of the label, or the end of the id (the bot's #abc123)
}

message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
  common.v1.PageInfo page_info = 2;
}

// SetSubscriptionLabelRequest names one of a reseller's services
// (PERMISSION_DENIED for anyone else; NOT_FOUND for a service not theirs).
message SetSubscriptionLabelRequest {
  string user_id = 1;
  string subscription_id = 2;
  string label = 3; // at most 64 characters; empty clears it
}

message GetResellerInfoRequest {
  string user_id = 1;
}

message ResellerBalance {
  string currency = 1;
  int64 balance = 2; // negative: what they owe
  int64 credit_limit = 3;
  int64 available = 4; // balance + credit_limit: what they can spend
}

// ResellerInfo is a reseller's panel in the bot (NOT_FOUND for anyone else).
message ResellerInfo {
  string tier_name = 1;
  int32 discount_percent = 2;
  int32 commission_percent = 3; // the reseller's own rate, else the tier's
  repeated ResellerBalance balances = 4; // per currency, IRT always listed
  int64 customers = 5; // users who joined through their link
  repeated common.v1.Money commission_earned = 6; // per currency
  string ref_code = 7; // the invite code (created on first request)
}

message CreateSupportTicketRequest {
  string user_id = 1;
  string category = 2;
  string text = 3;
}

message GetSettingsRequest {}

message GetBotPhotoRequest {}

// BotPhoto is the bot's Telegram profile photo, a square JPEG.
message BotPhoto {
  string version = 1; // as Settings.bot_photo_version
  bytes jpeg = 2;
}

message UpdateBrandingRequest {
  map<string, string> values = 1;
  string actor_id = 2;
  string reason = 3;
}

message ReviewManualPaymentRequest {
  string intent_id = 1;
  string reviewer_id = 2; // ignored: the reviewer is resolved from actor_telegram_id
  string decision = 3; // approved | rejected
  string reason = 4;
  int64 actor_telegram_id = 5; // must belong to an admin or the owner
}

message PaymentIntentRef {
  string id = 1;
  string status = 2;
  string order_id = 3;
  string provider = 4;
  string instructions = 5; // rendered payment instructions for the user
  common.v1.Money amount = 6;
  // Structured details so the bot can render instructions in the user's
  // language: card_number, card_holder, usdt_trc20, usdt_erc20, reference.
  map<string, string> details = 7;
  // Automated gateways: where to pay (Zarinpal), what is charged
  // there (XTR for a Stars invoice), and the invoice title.
  string pay_url = 8;
  common.v1.Money gateway_amount = 9;
  string description = 10;
  string failure_reason = 11;
}

message CheckPaymentRequest {
  string user_id = 1; // must own the intent
  string intent_id = 2;
}

// StarsPreCheckoutRequest relays a Telegram Stars pre_checkout_query.
message StarsPreCheckoutRequest {
  string user_id = 1;
  string intent_id = 2; // the invoice payload
  int64 total_amount = 3;
  string currency = 4;
}

// StarsPaidRequest relays a Telegram Stars successful_payment.
message StarsPaidRequest {
  string user_id = 1;
  string intent_id = 2; // the invoice payload
  int64 total_amount = 3;
  string currency = 4;
  string telegram_payment_charge_id = 5;
}

message ListPaymentMethodsRequest {
  string currency = 1; // the plan's currency, e.g. IRT
  int64 amount = 2; // the price in minor units, to apply each method's limits (0 = any)
}

message ListPaymentMethodsResponse {
  repeated string providers = 1; // automated methods usable now, e.g. zarinpal, stars
}

message SubmitPaymentProofRequest {
  string user_id = 1;
  string intent_id = 2;
  // Card payments: receipt photo (Telegram file_id) and bank reference number.
  string receipt_file = 3;
  string reference_number = 4;
  // Crypto payments: network and transaction id.
  string network = 5;
  string txid = 6;
}

message GetSubscriptionLinksRequest {
  string user_id = 1; // must own the subscription
  string subscription_id = 2;
}

message SubscriptionLinks {
  string subscription_link = 1;
  bytes qr_png = 2;
  repeated string config_links = 3;
}

// --- Admin RPCs: actor_telegram_id must belong to an active admin or owner.
// Every change is written to the audit log with the actor and the reason.

message AdminGetStatsRequest {
  int64 actor_telegram_id = 1;
}

message AdminStats {
  int64 users_total = 1;
  int64 users_today = 2;
  int64 active_subscriptions = 3;
  int64 pending_payments = 4;
  int64 provision_failed_orders = 5;
  // Every server taking new services answers (servers_* below); the detail
  // says why not, in English.
  bool panel_healthy = 6;
  string panel_detail = 7;
  // The 3x-ui servers from the provisioner's list. servers_known is false
  // when the provisioner did not answer. Only the servers taking new
  // services count (the others are not checked): servers_healthy of
  // servers_total answered their last health check or are not checked yet,
  // and servers_down names the others.
  bool servers_known = 8;
  int32 servers_total = 9;
  int32 servers_healthy = 10;
  repeated string servers_down = 11;
  // Every server of the list, the switched-off ones included: 0 means no
  // 3x-ui server was added yet.
  int32 servers_listed = 12;
}

message AdminListPendingPaymentsRequest {
  int64 actor_telegram_id = 1;
  int32 limit = 2;
}

message PendingPayment {
  string intent_id = 1;
  string order_id = 2;
  User user = 3;
  string provider = 4;
  common.v1.Money amount = 5;
  string receipt_file = 6;
  string reference_number = 7;
  string network = 8;
  string txid = 9;
  int64 submitted_at = 10;
  bool possible_duplicate = 11;
}

message AdminListPendingPaymentsResponse {
  repeated PendingPayment payments = 1;
}

message AdminFindUserRequest {
  int64 actor_telegram_id = 1;
  string query = 2; // Telegram id or @username
}

message AdminUserView {
  User user = 1;
  repeated Wallet wallets = 2;
  int64 subscriptions = 3;
  int64 orders = 4;
}

message AdminAdjustBalanceRequest {
  int64 actor_telegram_id = 1;
  string user_id = 2;
  common.v1.Money delta = 3; // signed; the balance can never go below zero (-credit_limit for a reseller)
  string reason = 4;
  string idempotency_key = 5;
}

message AdminSetUserStatusRequest {
  int64 actor_telegram_id = 1;
  string user_id = 2;
  string status = 3; // active | banned
  string reason = 4;
}

message AdminUpsertPlanRequest {
  int64 actor_telegram_id = 1;
  Plan plan = 2; // empty id creates a plan
}

message AdminSetSettingRequest {
  int64 actor_telegram_id = 1;
  string key = 2; // one of the documented setting keys
  string value = 3; // plain text
}

message PayOrderWithWalletRequest {
  string order_id = 1;
  // Kept for compatibility; the order id is the idempotency anchor (one order
  // can only ever be charged once).
  string idempotency_key = 2;
  string user_id = 3; // when set, must own the order
}

message CreatePaymentIntentRequest {
  string user_id = 1;
  string order_id = 2;        // empty for wallet top-up intents
  string provider = 3;        // manual_card | manual_crypto | zarinpal | stars
  common.v1.Money amount = 4; // required when order_id is empty
  string idempotency_key = 5;
}

message StartTrialRequest {
  string user_id = 1;
  string plan_id = 2;
  string idempotency_key = 3;
}

// CoreService owns users, plans, orders, wallet ledger, subscriptions,
// audit log, branding/settings, and the dashboard API backing store.
service CoreService {
  rpc UpsertUser(UpsertUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc GetWallet(GetWalletRequest) returns (Wallet);
  rpc ListLedgerEntries(ListLedgerEntriesRequest) returns (ListLedgerEntriesResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc CreateSupportTicket(CreateSupportTicketRequest) returns (Ticket);
  rpc GetSettings(GetSettingsRequest) returns (Settings);
  // UpdateBranding is not served (Unimplemented): branding is changed with
  // AdminSetSetting or the dashboard, which check and audit every value.
  rpc UpdateBranding(UpdateBrandingRequest) returns (Settings) {
    option deprecated = true;
  }
  rpc ReviewManualPayment(ReviewManualPaymentRequest) returns (PaymentIntentRef);
  rpc PayOrderWithWallet(PayOrderWithWalletRequest) returns (Order);
  rpc CreatePaymentIntent(CreatePaymentIntentRequest) returns (PaymentIntentRef);
  rpc StartTrial(StartTrialRequest) returns (Order);
  rpc CanStartTrial(CanStartTrialRequest) returns (CanStartTrialResponse);
  rpc SubmitPaymentProof(SubmitPaymentProofRequest) returns (PaymentIntentRef);
  rpc CheckPayment(CheckPaymentRequest) returns (PaymentIntentRef);
  rpc StarsPreCheckout(StarsPreCheckoutRequest) returns (PaymentIntentRef);
  rpc StarsPaid(StarsPaidRequest) returns (PaymentIntentRef);
  rpc ListPaymentMethods(ListPaymentMethodsRequest) returns (ListPaymentMethodsResponse);
  rpc GetSubscriptionLinks(GetSubscriptionLinksRequest) returns (SubscriptionLinks);
  rpc AdminGetStats(AdminGetStatsRequest) returns (AdminStats);
  rpc AdminListPendingPayments(AdminListPendingPaymentsRequest) returns (AdminListPendingPaymentsResponse);
  rpc AdminFindUser(AdminFindUserRequest) returns (AdminUserView);
  rpc AdminAdjustBalance(AdminAdjustBalanceRequest) returns (Wallet);
  rpc AdminSetUserStatus(AdminSetUserStatusRequest) returns (User);
  rpc AdminUpsertPlan(AdminUpsertPlanRequest) returns (Plan);
  rpc AdminSetSetting(AdminSetSettingRequest) returns (Settings);
  rpc QuoteOrder(QuoteOrderRequest) returns (Quote);
  rpc GetReferralInfo(GetReferralInfoRequest) returns (ReferralInfo);
  rpc AdminUpsertDiscount(AdminUpsertDiscountRequest) returns (Discount);
  rpc AdminListDiscounts(AdminListDiscountsRequest) returns (AdminListDiscountsResponse);
  rpc CreateDashboardLink(CreateDashboardLinkRequest) returns (DashboardLink);
  // ListStaffContacts lists the active owners and admins, for staff alerts.
  rpc ListStaffContacts(ListStaffContactsRequest) returns (ListStaffContactsResponse);
  // Support tickets (milestone 4). CreateSupportTicket stays for older bots.
  rpc AddTicketMessage(AddTicketMessageRequest) returns (AddTicketMessageResponse);
  rpc GetMyTickets(GetMyTicketsRequest) returns (MyTickets);
  rpc GetMyTicket(GetMyTicketRequest) returns (TicketThread);
  rpc CloseMyTicket(CloseMyTicketRequest) returns (Ticket);
  rpc GetTicketMessage(GetTicketMessageRequest) returns (TicketMessageView);
  rpc ReportTicketDelivery(ReportTicketDeliveryRequest) returns (ReportTicketDeliveryResponse);
  // Broadcasts (milestone 4): the bot claims recipients and reports results.
  rpc SetUserBotBlocked(SetUserBotBlockedRequest) returns (SetUserBotBlockedResponse);
  rpc ClaimBroadcastBatch(ClaimBroadcastBatchRequest) returns (BroadcastBatch);
  rpc ReportBroadcastResults(ReportBroadcastResultsRequest) returns (BroadcastState);
  // Resellers (milestone 5).
  rpc SetSubscriptionLabel(SetSubscriptionLabelRequest) returns (Subscription);
  rpc GetResellerInfo(GetResellerInfoRequest) returns (ResellerInfo);
  // GetBotPhoto returns the bot photo, for the bot to set in Telegram when
  // Settings.bot_photo_version changes; NOT_FOUND when there is none.
  rpc GetBotPhoto(GetBotPhotoRequest) returns (BotPhoto);
}

message CanStartTrialRequest {
  string user_id = 1;
}

message CanStartTrialResponse {
  bool eligible = 1;
}
