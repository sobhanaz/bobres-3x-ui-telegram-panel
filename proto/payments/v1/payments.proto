syntax = "proto3";

package payments.v1;

import "common/v1/types.proto";

option go_package = "github.com/sobhanaz/bobres-3x-ui-telegram-panel/gen/proto/payments/v1;paymentsv1";

message PaymentIntent {
  string id = 1;
  string order_id = 2; // empty for wallet top-ups
  string user_id = 3;
  string provider = 4; // wallet | manual_card | manual_crypto | zarinpal | stars
  common.v1.Money amount = 5;
  string status = 6; // pending|confirming|succeeded|failed|expired
  string provider_ref = 7; // gateways: bank reference or transaction hash
  int64 expires_at = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  // Automated gateways: what the customer pays there, fixed at creation (IRR for
  // Zarinpal, XTR for Telegram Stars).
  common.v1.Money gateway_amount = 11;
  string pay_url = 12; // where the customer pays (Zarinpal: a page on this install)
  string external_id = 13; // the gateway's id for the payment
  string failure_reason = 14; // why a gateway payment failed
}

message CreateIntentRequest {
  string order_id = 1; // optional, empty for top-ups
  string user_id = 2;
  string provider = 3;
  common.v1.Money amount = 4;
  string idempotency_key = 5;
  // Automated gateways (zarinpal, stars): the amount to charge at the
  // gateway, computed by core from its rates. Not used by manual providers.
  common.v1.Money gateway_amount = 6;
  string description = 7; // shown at the gateway, e.g. the plan name
}

// CheckIntentRequest asks the gateway about an open intent now.
message CheckIntentRequest {
  string intent_id = 1;
  string user_id = 2; // must own the intent
}

// PrecheckStarsPaymentRequest: the bot received a pre_checkout_query for a
// Telegram Stars invoice; nothing is charged yet.
message PrecheckStarsPaymentRequest {
  string intent_id = 1; // the invoice payload
  string user_id = 2; // the payer; must own the intent
  int64 total_amount = 3; // Stars, as Telegram reports them
  string currency = 4; // must be XTR
}

// ConfirmStarsPaymentRequest: the bot received a successful_payment.
message ConfirmStarsPaymentRequest {
  string intent_id = 1; // the invoice payload
  string user_id = 2; // the payer; must own the intent
  int64 total_amount = 3; // Stars, as Telegram reports them
  string currency = 4; // must be XTR
  string telegram_payment_charge_id = 5;
}

message ListGatewaysRequest {}

message ListGatewaysResponse {
  repeated string providers = 1; // enabled automated providers
}

message GetIntentRequest {
  string id = 1;
}

message SubmitReceiptRequest {
  string intent_id = 1;
  string user_id = 2;
  string receipt_file = 3;
  string reference_number = 4;
}

message SubmitTXIDRequest {
  string intent_id = 1;
  string user_id = 2;
  string network = 3;
  string txid = 4;
}

message ReviewManualPaymentRequest {
  string intent_id = 1;
  string reviewer_id = 2;
  string decision = 3; // approved | rejected
  string reason = 4;
}

message ListPendingReceiptsRequest {
  common.v1.Pagination pagination = 1;
}

// ManualReceipt is the proof a user submitted for a manual intent, and its
// review once there is one.
message ManualReceipt {
  string receipt_file = 1; // Telegram file_id of the receipt photo (card)
  string reference_number = 2; // bank tracking number (card)
  string network = 3; // crypto network, e.g. TRC20
  string txid = 4; // crypto transaction id
  int64 submitted_at = 5;
  string decision = 6; // approved | rejected | "" (not reviewed)
  string review_reason = 7;
  string reviewed_by = 8; // core user id of the reviewer
  int64 reviewed_at = 9;
}

// PendingReceipt is one item of the manual review queue.
message PendingReceipt {
  PaymentIntent intent = 1;
  ManualReceipt receipt = 2;
  // Another receipt already carries the same card reference number. Shown to
  // the reviewer as a warning; reference numbers can legitimately repeat.
  bool possible_duplicate = 3;
}

// ListIntentsRequest filters the payment history; every field is optional.
message ListIntentsRequest {
  string user_id = 1;
  string order_id = 2;
  string status = 3;
  string provider = 4;
  common.v1.Pagination pagination = 5;
  string intent_id = 6; // one payment
}

// IntentRecord is one payment with the proof sent for it (manual payments).
message IntentRecord {
  PaymentIntent intent = 1;
  ManualReceipt receipt = 2; // unset when there is none
}

message ListIntentsResponse {
  repeated IntentRecord records = 1; // newest first
  common.v1.PageInfo page_info = 2;
}

message ListPendingReceiptsResponse {
  repeated PaymentIntent intents = 1;
  common.v1.PageInfo page_info = 2;
  repeated PendingReceipt receipts = 3; // same order as intents, with proof details
}

// GatewayConfig is an automated gateway's settings as staff see them: whether
// the merchant id and the proxy are set, never their values.
message GatewayConfig {
  string provider = 1; // zarinpal
  bool enabled = 2; // switched on by the owner
  // It has credentials: payments already open keep being checked, even when
  // switched off.
  bool configured = 3;
  bool sandbox = 4;
  string merchant_hint = 5; // the merchant id's last 4 characters, "" when none
  bool proxy_set = 6;
  // No payments master key: the settings come from the environment and
  // cannot be changed ("add the payments key: re-run bobres install").
  bool key_missing = 7;
  // New payments can use it now: enabled, configured and no problem.
  bool offered = 8;
  // Why the settings cannot be used: "" | unreadable (stored, but the master
  // key is missing or another one) | sandbox_refused (sandbox in prod) |
  // public_url (switched on, but the public URL is not https://host[:port]) |
  // invalid (refused by the client).
  string problem = 9;
  bool from_env = 10; // read from the environment (key_missing)
  int64 updated_at = 11; // 0 for the environment's settings
  string updated_by = 12; // core user id of the staff member, "" when none
}

message ListGatewayConfigsRequest {}

message ListGatewayConfigsResponse {
  repeated GatewayConfig configs = 1;
}

// SetGatewayConfigRequest replaces a gateway's settings. enabled and sandbox
// are the new values; an empty merchant_id or proxy keeps the stored one.
// Switching off only stops offering it. The merchant id and the sandbox cannot
// change while payments are open (FailedPrecondition, the count in the message).
message SetGatewayConfigRequest {
  string provider = 1;
  bool enabled = 2;
  bool sandbox = 3;
  string merchant_id = 4;
  string proxy = 5; // http(s)://[user:password@]host:port
  bool clear_proxy = 6;
  string actor_id = 7; // core user id of the staff member
}

// GatewayCandidate is settings to test before saving them; an empty
// merchant_id or proxy means the stored one.
message GatewayCandidate {
  bool sandbox = 1;
  string merchant_id = 2;
  string proxy = 3;
  bool clear_proxy = 4;
}

// TestGatewayRequest checks credentials and their route (proxy, registered
// IP) with a read-only call; nothing is stored, created or verified.
message TestGatewayRequest {
  string provider = 1;
  GatewayCandidate candidate = 2; // unset: the stored settings
}

message TestGatewayResponse {
  bool ok = 1;
  string detail = 2; // why it failed; never a secret or an address
  int32 unverified = 3; // paid payments the gateway still waits for us to verify
  int64 latency_ms = 4;
}

// GatewayReportRequest: one payment method's payments created in [from, to)
// (unix seconds; to = 0: now, from = 0: 30 days before to; at most 366 days).
message GatewayReportRequest {
  string provider = 1; // zarinpal | stars | manual_card | manual_crypto | manual_zarinpal
  int64 from = 2;
  int64 to = 3;
}

// GatewayStatusTotal is the payments of one status in a report.
message GatewayStatusTotal {
  string status = 1;
  int64 count = 2;
  repeated common.v1.Money amounts = 3; // sum charged, per currency
  repeated common.v1.Money gateway_amounts = 4; // sum asked at the gateway (IRR, XTR)
}

message GatewayReasonCount {
  string reason = 1; // e.g. expired, gateway_failed, amount_mismatch, reversed
  int64 count = 2;
}

// GatewayEvent is one entry of the gateway audit trail.
message GatewayEvent {
  int64 at = 1;
  string kind = 2; // create | callback | check | confirm ...
  string intent_id = 3;
  string detail = 4; // the error of an error event; never a secret or an address
}

message GatewayReportResponse {
  string provider = 1;
  int64 from = 2;
  int64 to = 3;
  repeated GatewayStatusTotal totals = 4; // by status
  repeated GatewayReasonCount failures = 5; // failed or expired, most frequent first
  int64 open_count = 6; // open now, whatever the period
  int64 oldest_open_at = 7; // 0 = none open
  GatewayEvent last_error = 8; // unset: none
  GatewayEvent last_paid = 9; // unset: none
}

// PaymentsService owns payment intents, manual receipts, and the
// payments-side ledger mirror used for provider reconciliation.
service PaymentsService {
  rpc CreateIntent(CreateIntentRequest) returns (PaymentIntent);
  rpc GetIntent(GetIntentRequest) returns (PaymentIntent);
  rpc SubmitReceipt(SubmitReceiptRequest) returns (PaymentIntent);
  rpc SubmitTXID(SubmitTXIDRequest) returns (PaymentIntent);
  rpc ReviewManualPayment(ReviewManualPaymentRequest) returns (PaymentIntent);
  rpc ListPendingReceipts(ListPendingReceiptsRequest) returns (ListPendingReceiptsResponse);
  // The payment history (staff), with filters.
  rpc ListIntents(ListIntentsRequest) returns (ListIntentsResponse);
  rpc CheckIntent(CheckIntentRequest) returns (PaymentIntent);
  // Telegram Stars: validate before Telegram charges, then settle the payment.
  rpc PrecheckStarsPayment(PrecheckStarsPaymentRequest) returns (PaymentIntent);
  rpc ConfirmStarsPayment(ConfirmStarsPaymentRequest) returns (PaymentIntent);
  rpc ListGateways(ListGatewaysRequest) returns (ListGatewaysResponse);
  // Gateway settings (the owner, through core). The secrets never come back.
  rpc ListGatewayConfigs(ListGatewayConfigsRequest) returns (ListGatewayConfigsResponse);
  rpc SetGatewayConfig(SetGatewayConfigRequest) returns (GatewayConfig);
  rpc TestGateway(TestGatewayRequest) returns (TestGatewayResponse);
  rpc GatewayReport(GatewayReportRequest) returns (GatewayReportResponse);
}
